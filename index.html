\nAlleluia! Alleluia!","learn_title":"The Second Petition of the Lord's Prayer","learn_cite":"LSB p. 323","learn_quote":"Thy kingdom come. What does this mean? God's kingdom comes when our heavenly Father gives us His Holy Spirit, so that by His grace we believe His holy Word and lead godly lives here in time and there in eternity.","introit_cite":"Psalm 31:1, 3, 5; antiphon: Revelation 7:14b","introit_lines":["<b>These are the ones coming out of the great tribulation.<\/b>","<b>They have washed their robes and made them white in the blood of the Lamb.<\/b>","In you, O LORD, do I take refuge; let me never be put to shame;","in your righteousness deliver me.","For you are my rock and my fortress;","and for your name's sake you lead me and guide me.","Into your hand I commit my spirit;","you have redeemed me, O LORD, faithful God.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>These are the ones coming out of the great tribulation.<\/b>","<b>They have washed their robes and made them white in the blood of the Lamb.<\/b>"],"introit_note":"","collect":"Almighty and everlasting God, You knit together Your faithful people of all times and places into one holy communion, the mystical body of Your Son, Jesus Christ. Grant us so to follow Your blessed saints in all virtuous and godly living that, together with them, we may come to the unspeakable joys You have prepared for those who love You; through Jesus Christ, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Revelation 7:14b; Psalm 84:5","gradual_lines":["These are the ones coming out of the great tribulation.","They have washed their robes and made them white in the blood of the Lamb.","Blessed are those whose strength is in you,","in whose heart are the highways to Zion."],"week_at_home":"John sees a crowd too large to count, from every nation and language, standing before the throne in white robes — and when he asks who they are, the answer is that they came out of great tribulation and washed their robes in the blood of the Lamb. That is the whole doctrine of sainthood in one sentence: not people who were impressive, but people who were washed. This week begins with the death of Moses and moves into Jeremiah, and on Wednesday Jesus says God “is not God of the dead, but of the living.” Ask one another: “Who in our family has died in the faith — and what does it mean that they are more alive right now than we are?”","kids":{"title":"What is “All Saints' Day”?","what":"All Saints' Day is the day in the Church Year when we remember and give thanks for all those who have died with faith in Jesus and are now with Him. The word “saint” comes from the Latin sanctus, meaning “holy.” Saints are simply God's holy people.","why":"Do you have to die to be a saint? No way! All of God's faithful people are His saints. You were washed clean of your sins at your Baptism and made holy before God. That is what Scripture means when it says, “They have washed their robes and made them white in the blood of the Lamb.” It is not what you have done that makes you a saint, but what Jesus has done for you.","parents":"Talk to your children about those in your own family who have died in the faith. Explain that they are now with Jesus, and remind them that this is the fulfillment of God's promises made at their Baptism."},"days":[{"name":"Sunday","abbr":"Sun","date":"November 1, 2026","theme":"A Multitude No One Could Number","ot":"Deuteronomy 34:1–12 — Moses sees the land from Mount Nebo and dies; no one knows his grave","nt":"Matthew 21:1–22 — Jesus enters Jerusalem; the crowds cry “Hosanna to the Son of David!”","extra":"Matthew 5:1–12 — the Beatitudes; Revelation 7:9–17 — the saints before the throne","talk":["Younger children: In heaven there are more people than anyone could count. What does the Bible say they are all wearing, and how did the robes get white?","Older children: Moses died outside the land he had spent forty years walking toward — and then appears inside it, on the Mount of Transfiguration. What does that say about promises God seems not to keep?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"November 2, 2026","theme":"Before I Formed You in the Womb I Knew You","ot":"Jeremiah 1:1–19 — Jeremiah is called as a young man: “Do not say, ‘I am only a youth'”","nt":"Matthew 21:23–46 — The wicked tenants; the stone the builders rejected","extra":"","talk":["Younger children: Jeremiah told God he was too young. What did God say back to him?","Older children: God says He knew Jeremiah before he was born. How does that speak to someone wondering whether their life has a purpose?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"November 3, 2026","theme":"Return, Faithless Children","ot":"Jeremiah 3:6—4:2 — “Return, O faithless children, declares the LORD; for I am your master”","nt":"Matthew 22:1–22 — The wedding feast; render to Caesar","extra":"","talk":["Younger children: God kept inviting His people to come back to Him. How many times do you think He asked?","Older children: Jeremiah 3 is God pleading with people who have already left. What does that reveal about how God feels toward those who have wandered from church?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"November 4, 2026","theme":"He Is Not God of the Dead, but of the Living","ot":"Jeremiah 5:1–19 — “Run through the streets of Jerusalem… see if you can find a man who does justice”","nt":"Matthew 22:23–46 — “I am the God of Abraham” — He is not God of the dead but of the living","extra":"","talk":["Younger children: Jesus said God is the God of living people, not dead ones — and He said that about Abraham, who died long ago. What does that mean about people who have died believing in Jesus?","Older children: Jesus proves the resurrection from a verb tense. Why does He treat one small word of Scripture as enough to settle the question?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"November 5, 2026","theme":"Do Not Trust in Deceptive Words","ot":"Jeremiah 7:1–29 — The temple sermon: “Do not trust in these deceptive words, ‘This is the temple of the LORD'”","nt":"Matthew 23:1–12 — The greatest among you shall be your servant","extra":"","talk":["Younger children: The people thought that having a beautiful church building would keep them safe. What does God actually want?","Older children: Jeremiah preached against religious confidence in the church door. Where might that sermon land in our own life?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"November 6, 2026","theme":"Is There No Balm in Gilead?","ot":"Jeremiah 8:18—9:12 — “My joy is gone; grief is upon me… Is there no balm in Gilead?”","nt":"Matthew 23:13–39 — “O Jerusalem… how often would I have gathered your children as a hen gathers her brood”","extra":"","talk":["Younger children: Jeremiah cried over people who would not listen. Jesus cried over a whole city. Does God feel sad when people turn away?","Older children: Both readings are laments from a broken heart. How does grief over sin differ from anger at sinners?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"November 7, 2026","theme":"See That No One Leads You Astray","ot":"Jeremiah 11:1–23 — “Hear the words of this covenant” — Jeremiah's own townsmen plot against him","nt":"Matthew 24:1–28 — Not one stone left on another; see that no one leads you astray","extra":"","talk":["Younger children: Jeremiah's own neighbors turned against him for telling the truth. Who stayed with him?","Older children: Jesus says the temple will be torn down — the same building Jeremiah preached against. Why is it a mercy that God will not let us keep a false security?","Look ahead: Read part of tomorrow's Gospel, Matthew 25:1–13 (the ten virgins), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-11-01.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/677","yt_url":"https://www.youtube.com/results?search_query=LSB%20677%20For%20All%20the%20Saints%20hymn"},"2026-11-08":{"key":"2026-11-08","ready":true,"range_label":"November 8–14, 2026","sunday_name":"The Twenty-fourth Sunday after Pentecost (Proper 27)","sunday_date":"November 8, 2026","proper_label":"Proper 27, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"Keep your lamp burning — the Bridegroom is coming","sunday_readings":"Amos 5:18–24 · Psalm 70 · 1 Thessalonians 4:13–18 · Matthew 25:1–13","next_sunday_label":"Proper 28","next_sunday_readings":"Zephaniah 1:7–16 · Psalm 90:1–12 · 1 Thessalonians 5:1–11 · Matthew 25:14–30","memory_ref":"1 Peter 1:24–25","memory_text":"The grass withers, and the flower falls, but the word of the Lord remains forever.","hymn_title":"Wake, Awake, for Night Is Flying","hymn_num":"LSB 516","hymn_full":"“Wake, awake, for night is flying,”\nThe watchmen on the heights are crying;\n“Awake, Jerusalem, arise!”\nMidnight hears the welcome voices\nAnd at the thrilling cry rejoices:\n“Oh, where are ye, ye virgins wise?\nThe Bridegroom comes, awake!\nYour lamps with gladness take!\nAlleluia!\nWith bridal care\nYourselves prepare\nTo meet the Bridegroom, who is near.”\n\nZion hears the watchmen singing,\nAnd all her heart with joy is springing;\nShe wakes, she rises from her gloom.\nFor her Lord comes down all-glorious,\nThe strong in grace, in truth victorious;\nHer star is ris'n, her light is come.","learn_title":"The Seventh Petition of the Lord's Prayer","learn_cite":"LSB p. 324","learn_quote":"But deliver us from evil. What does this mean? We pray in this petition, in summary, that our Father in heaven would rescue us from every evil of body and soul, possessions and reputation, and finally, when our last hour comes, give us a blessed end, and graciously take us from this valley of sorrow to Himself in heaven.","introit_cite":"Psalm 84:1, 9–12; antiphon: v. 3","introit_lines":["<b>Even the sparrow finds a home, and the swallow a nest for herself,<\/b>","<b>at your altars, O LORD of hosts, my King and my God.<\/b>","How lovely is your dwelling place,","O LORD of hosts!","Behold our shield, O God;","look on the face of your anointed!","For a day in your courts is better than a thousand elsewhere.","I would rather be a doorkeeper in the house of my God than dwell in the tents of wickedness.","For the LORD God is a sun and shield; the LORD bestows favor and honor.","No good thing does he withhold from those who walk uprightly.","O LORD of hosts,","blessed is the one who trusts in you!","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>Even the sparrow finds a home, and the swallow a nest for herself,<\/b>","<b>at your altars, O LORD of hosts, my King and my God.<\/b>"],"introit_note":"","collect":"","gradual_cite":"Revelation 7:14b; Psalm 84:5","gradual_lines":["These are the ones coming out of the great tribulation.","They have washed their robes and made them white in the blood of the Lamb.","Blessed are those whose strength is in you,","in whose heart are the highways to Zion."],"week_at_home":"Ten young women wait for a bridegroom who is late. Five brought extra oil; five did not, and when the cry goes up at midnight there is no time left to borrow. Jesus ends it simply: “Watch therefore, for you know neither the day nor the hour.” Paul comforts the Thessalonians this Sunday with the reason we can wait without dread — the dead in Christ will rise. This week Jeremiah preaches to a city that will not listen, and Matthew moves toward the upper room. Ask one another: “What would it look like to be ready — not anxious, but ready?”","kids":{"title":"What is that great big candle?","what":"The tall candle standing near the baptismal font or the altar is the Paschal Candle. Some candles we light every Sunday; this one is lit at special times — at Easter, at Baptisms, and at funerals.","why":"The Paschal Candle reminds us of Jesus' victory over death. Remember the pillar of fire that led Israel through the night after God rescued them from slavery? When Jesus died, He released us from the slavery of darkness and death. In this Sunday's Gospel, five wise young women keep their lamps burning through the night. That light is His, not ours.","parents":"Take your children up to look at the Paschal Candle and point out the symbols on it. Remind them that “Jesus Christ is the Light of the world, the Light no darkness can overcome.”"},"days":[{"name":"Sunday","abbr":"Sun","date":"November 8, 2026","theme":"Watch Therefore — You Know Neither the Day nor the Hour","ot":"Jeremiah 20:1–18 — Jeremiah is beaten and put in the stocks, yet God's word is like fire in his bones","nt":"Matthew 24:29–51 — Be ready; the faithful and wise servant whom the master finds at work","extra":"Matthew 25:1–13 — the wise and foolish virgins","talk":["Younger children: Five of the young women brought extra oil and five did not. What happened when the bridegroom finally came?","Older children: Jeremiah says he tried to stop speaking and could not — God's word was fire shut up in his bones. What is the difference between duty and that?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"November 9, 2026","theme":"Oil You Cannot Borrow","ot":"Jeremiah 22:1–23 — “Do justice and righteousness, and deliver the one who has been robbed”","nt":"Matthew 25:1–13 — The parable of the ten virgins","extra":"","talk":["Younger children: The five who ran out of oil asked to borrow some. Why couldn't the others just share?","Older children: Faith cannot be borrowed at the last minute from a parent or a friend. What does that mean for the difference between your family's faith and your own?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"November 10, 2026","theme":"The LORD Is Our Righteousness","ot":"Jeremiah 23:1–20 — Woe to the shepherds who scatter — God will raise up a righteous Branch for David","nt":"Matthew 25:14–30 — The parable of the talents","extra":"","talk":["Younger children: God promised to send a good Shepherd-King when the bad ones failed. Who is He?","Older children: Jeremiah names Him “The LORD is our righteousness.” How does that name answer the servant who was afraid of his master?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"November 11, 2026","theme":"As You Did It to One of the Least of These","ot":"Jeremiah 23:21–40 — False prophets speak visions of their own minds, not from the LORD's mouth","nt":"Matthew 25:31–46 — The Son of Man separates the sheep from the goats","extra":"","talk":["Younger children: Jesus says that helping a hungry or lonely person is like helping Him. Who could you help this week?","Older children: Neither the sheep nor the goats knew what they had been doing. What does that suggest about how genuine faith actually behaves?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"November 12, 2026","theme":"Twenty-Three Years of Preaching to a Closed Door","ot":"Jeremiah 25:1–18 — “For twenty-three years I have spoken to you, and you have not listened”","nt":"Matthew 26:1–19 — A woman anoints Jesus for burial; Judas agrees on a price","extra":"","talk":["Younger children: Jeremiah preached for twenty-three years and hardly anyone listened. Would you have kept going?","Older children: One woman pours out a year's wages; one disciple sells Him for thirty pieces of silver. What makes the difference between them?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"November 13, 2026","theme":"Take, Eat — This Is My Body","ot":"Jeremiah 26:1–19 — Jeremiah is put on trial for his life, and the elders remember Micah","nt":"Matthew 26:20–35 — The Lord's Supper is instituted; Peter promises he will never fall away","extra":"","talk":["Younger children: On the night before He died, Jesus gave His friends a special meal. What did He say the bread and wine are?","Older children: Jeremiah's life was spared because someone remembered an old prophet's words. How does remembering rightly protect a church?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"November 14, 2026","theme":"Plans for Welfare and Not for Evil","ot":"Jeremiah 29:1–19 — To the exiles: build houses, plant gardens, seek the welfare of the city, and pray for it","nt":"Matthew 26:36–56 — Gethsemane: “Not as I will, but as You will”","extra":"","talk":["Younger children: God told His people, far from home, to plant gardens and pray for the city they were in. What does that say about where God wants you to be right now?","Older children: Jeremiah 29:11 is often quoted alone. Read it in context — it is spoken to exiles facing seventy years. How does that change it?","Look ahead: Read part of tomorrow's Gospel, Matthew 25:14–30 (the talents), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-11-08.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/516","yt_url":"https://www.youtube.com/results?search_query=LSB%20516%20Wake%2C%20Awake%2C%20for%20Night%20Is%20Flying%20hymn"},"2026-11-15":{"key":"2026-11-15","ready":true,"range_label":"November 15–21, 2026","sunday_name":"The Twenty-fifth Sunday after Pentecost (Proper 28)","sunday_date":"November 15, 2026","proper_label":"Proper 28, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"Well done, good and faithful servant — entrusted, not merely employed","sunday_readings":"Zephaniah 1:7–16 · Psalm 90:1–12 · 1 Thessalonians 5:1–11 · Matthew 25:14–30","next_sunday_label":"Last Sunday (Proper 29)","next_sunday_readings":"Ezekiel 34:11–16, 20–24 · Psalm 95:1–7a · 1 Corinthians 15:20–28 · Matthew 25:31–46","memory_ref":"Proverbs 18:10","memory_text":"The name of the Lord is a strong tower; the righteous man runs into it and is safe.","hymn_title":"Forth in Thy Name, O Lord, I Go","hymn_num":"LSB 854","hymn_full":"Forth in Thy name, O Lord, I go,\nMy daily labor to pursue,\nThee, only Thee, resolved to know\nIn all I think or speak or do.\n\nThe task Thy wisdom has assigned\nOh, let me cheerfully fulfill,\nIn all my works Thy presence find,\nAnd prove Thy good and perfect will.\n\nThee may I set at my right hand,\nWhose eyes my inmost substance see,\nAnd labor on at Thy command\nAnd offer all my works to Thee.","learn_title":"The First Petition of the Lord's Prayer","learn_cite":"LSB p. 323","learn_quote":"Hallowed be Thy name. What does this mean? God's name is certainly holy in itself, but we pray in this petition that it may be kept holy among us also. How is God's name kept holy? When the Word of God is taught in its truth and purity, and we, as the children of God, also lead holy lives according to it.","introit_cite":"Psalm 143:2, 5–6, 10–11; antiphon: v. 1","introit_lines":["<b>Hear my prayer, O LORD; give ear to my pleas for mercy!<\/b>","<b>In your faithfulness answer me, in your righteousness!<\/b>","Enter not into judgment with your servant,","for no one living is righteous before you.","I remember the days of old; I meditate on all that you have done;","I ponder the work of your hands.","I stretch out my hands to you;","my soul thirsts for you like a parched land.","Teach me to do your will, for you are my God!","Let your good Spirit lead me on level ground!","For your name's sake, O LORD, preserve my life!","In your righteousness bring my soul out of trouble!","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>Hear my prayer, O LORD; give ear to my pleas for mercy!<\/b>","<b>In your faithfulness answer me, in your righteousness!<\/b>"],"introit_note":"","collect":"","gradual_cite":"Revelation 7:14b; Psalm 84:5","gradual_lines":["These are the ones coming out of the great tribulation.","They have washed their robes and made them white in the blood of the Lamb.","Blessed are those whose strength is in you,","in whose heart are the highways to Zion."],"week_at_home":"A master leaves on a journey and hands his servants an astonishing amount of money — and then simply trusts them with it. Two of them go to work. The third buries his portion because, he says, he was afraid. Notice what Jesus calls the sin: not losing the money, but refusing to risk anything with it. This week Jeremiah promises a new covenant written on hearts, and Matthew walks all the way to the empty tomb. Ask one another: “What has God handed our family that we have buried because we were afraid?”","kids":{"title":"What is the “Benediction”?","what":"The Benediction (pronounced ben-eh-DIK-shun) is God's blessing given to the congregation through the pastor at the very end of the service. The one we use in the Divine Service is the Aaronic Benediction, from Numbers 6:24–26.","why":"The word comes from the Latin bene, “well,” and dicere, “to speak” — God is speaking well to us. He sends us on our way with His blessing after we have received His gifts in Word and Sacrament. That is exactly what this Sunday's Gospel is about: servants sent out with something valuable entrusted to them. God sure does a lot of giving to His people!","parents":"Show your children the different services in the hymnal and let them find the benediction for each one. Help them locate the Aaronic Benediction and read it together."},"days":[{"name":"Sunday","abbr":"Sun","date":"November 15, 2026","theme":"Well Done, Good and Faithful Servant","ot":"Jeremiah 30:1–24 — “I will restore health to you and heal your wounds, declares the LORD”","nt":"Matthew 26:57–75 — Jesus before the council; Peter weeps bitterly","extra":"Matthew 25:14–30 — the parable of the talents","talk":["Younger children: Two servants used what the master gave them. One buried his in the ground. Why do you think he did that?","Older children: The third servant's excuse was fear, and his picture of the master was wrong. How does what you believe about God shape what you dare to do?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"November 16, 2026","theme":"A New Covenant Written on Hearts","ot":"Jeremiah 31:1–17, 23–34 — “I will put My law within them and write it on their hearts; I will remember their sin no more”","nt":"Matthew 27:1–10 — Judas' remorse and his end","extra":"","talk":["Younger children: God promised to write His words inside people's hearts instead of on stone. Has He done that for you?","Older children: Judas was sorry and it destroyed him; Peter was sorry and was restored. What does Jeremiah 31:34 say God does with remembered sin?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"November 17, 2026","theme":"Call to Me and I Will Answer You","ot":"Jeremiah 33:1–22 — “Call to Me and I will answer you, and will tell you great and hidden things”","nt":"Matthew 27:11–32 — Jesus before Pilate; Simon of Cyrene is made to carry the cross","extra":"","talk":["Younger children: God invites us to call to Him and promises to answer. What will you call to Him about tonight?","Older children: Jeremiah receives this promise while shut up in the court of the guard. Where is the promise made, and to whom?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"November 18, 2026","theme":"It Is Finished","ot":"Jeremiah 37:1–21 — Jeremiah tells the truth to a king who wants a different answer","nt":"Matthew 27:33–56 — The crucifixion; the curtain of the temple is torn in two","extra":"","talk":["Younger children: When Jesus died, the big curtain in the temple ripped from top to bottom. Who tore it, and what does it mean?","Older children: Zedekiah kept asking Jeremiah for a word from God and kept ignoring it. What is the difference between wanting God's word and wanting God's approval?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"November 19, 2026","theme":"Down in the Cistern","ot":"Jeremiah 38:1–28 — Jeremiah is lowered into the mud of a cistern, and a foreigner rescues him","nt":"Matthew 27:57–66 — Joseph of Arimathea lays Jesus in a new tomb and rolls the stone","extra":"","talk":["Younger children: Jeremiah was stuck in deep mud until someone let down old rags so the ropes wouldn't hurt him. What kindness could you show someone this week?","Older children: Both readings end with a man in a pit and a stranger who takes a risk to help. What does courage cost in each case?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"November 20, 2026","theme":"He Is Not Here — He Has Risen","ot":"Daniel 1:1–21 — Daniel resolves not to defile himself, and God gives him learning and skill","nt":"Matthew 28:1–20 — The resurrection; “All authority in heaven and on earth has been given to Me”","extra":"","talk":["Younger children: The angel said Jesus is not in the tomb. Where is He now, and what did He promise at the very end of Matthew?","Older children: Daniel made his decision as a teenager, far from home, with no one watching. How does that connect to being a faithful servant with the master away?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"November 21, 2026","theme":"The God Who Reveals Mysteries","ot":"Daniel 2:1–23 — Daniel praises the God who changes times and seasons and reveals deep things","nt":"Revelation 18:1–24 — The fall of Babylon, the city that thought it would never mourn","extra":"","talk":["Younger children: Daniel thanked God before telling anyone the good news. What could you thank God for right now?","Older children: Babylon says in her heart, “I sit as a queen, I am no widow.” Where do you hear that voice today?","Look ahead: Tomorrow is the Last Sunday of the Church Year. Read Matthew 25:31–46, the sheep and the goats."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-11-15.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/854","yt_url":"https://www.youtube.com/results?search_query=LSB%20854%20Forth%20in%20Thy%20Name%2C%20O%20Lord%2C%20I%20Go%20hymn"},"2026-11-22":{"key":"2026-11-22","ready":true,"range_label":"November 22–28, 2026","sunday_name":"The Last Sunday of the Church Year (Proper 29)","sunday_date":"November 22, 2026","proper_label":"Proper 29, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"The King on His throne — and the Church Year comes home","sunday_readings":"Ezekiel 34:11–16, 20–24 · Psalm 95:1–7a · 1 Corinthians 15:20–28 · Matthew 25:31–46","next_sunday_label":"Advent 1 (Series B begins)","next_sunday_readings":"Isaiah 64:1–9 · Psalm 80:1–7 · 1 Corinthians 1:3–9 · Mark 11:1–10 or Mark 13:24–37","memory_ref":"Colossians 4:2","memory_text":"Continue steadfastly in prayer, being watchful in it with thanksgiving.","hymn_title":"Crown Him with Many Crowns","hymn_num":"LSB 525","hymn_full":"Crown Him with many crowns,\nThe Lamb upon His throne;\nHark! How the heav'nly anthem drowns\nAll music but its own.\nAwake, my soul, and sing\nOf Him who died for thee,\nAnd hail Him as thy matchless king\nThrough all eternity.\n\nCrown Him the Lord of love.\nBehold His hands and side,\nRich wounds, yet visible above,\nIn beauty glorified.\nNo angel in the sky\nCan fully bear that sight,\nBut downward bends his burning eye\nAt mysteries so bright.","learn_title":"The Close of the Commandments","learn_cite":"LSB p. 322","learn_quote":"God threatens to punish all who break these commandments. Therefore we should fear His wrath and not do anything against them. But He promises grace and every blessing to all who keep these commandments. Therefore we should also love and trust in Him and gladly do what He commands.","introit_cite":"Psalm 39:4–5, 7–8, 12a; antiphon: 2 Peter 3:13b","introit_lines":["<b>According to his promise we are waiting for new heavens and a new earth<\/b>","<b>in which righteousness dwells.<\/b>","O LORD, make me know my end and what is the measure of my days;","let me know how fleeting I am!","Behold, you have made my days a few handbreadths, and my lifetime is as nothing before you.","Surely all mankind stands as a mere breath!","And now, O Lord, for what do I wait?","My hope is in you.","Deliver me from all my transgressions.","Do not make me the scorn of the fool!","Hear my prayer, O LORD,","and give ear to my cry.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>According to his promise we are waiting for new heavens and a new earth<\/b>","<b>in which righteousness dwells.<\/b>"],"introit_note":"","collect":"","gradual_cite":"","gradual_lines":[],"week_at_home":"The Church Year ends where everything ends: with the King on His throne, separating sheep from goats, and telling the righteous that when they fed the hungry and visited the prisoner they were doing it to Him. Ezekiel promises this Sunday that God Himself will come and shepherd His scattered flock. This week Daniel stands before furnaces and lions and kings, and Revelation opens onto a new heaven and a new earth where God wipes away every tear. Thanksgiving falls on Thursday. Ask one another: “If the King is already among us in the hungry and the forgotten, who is He this week?”","kids":{"title":"What is the “Sunday of the Fulfillment”?","what":"The Sunday of the Fulfillment is the last Sunday of the Church Year. It is the day we look forward to the coming of our Lord Jesus on the Last Day.","why":"Have you ever had to wait a long time for something you really wanted? The waiting is hard, but when the gift finally comes, all that waiting feels complete — “fulfilled.” Christians are waiting for Jesus to return. When He does, Scripture says He will take His people to be with Him in His kingdom forever. Now that is something to be excited about!","parents":"Talk with your children about what will happen when Jesus returns; read portions of Matthew 24 and 25 together. Remind them that in Baptism Jesus makes us His own, and that through faith in Him we live as people patiently awaiting His return."},"days":[{"name":"Sunday","abbr":"Sun","date":"November 22, 2026","theme":"The King on His Throne","ot":"Daniel 2:24–49 — Daniel interprets the dream: a stone cut by no human hand becomes a mountain","nt":"Revelation 19:1–21 — Hallelujah! The marriage supper of the Lamb; the Word of God rides out","extra":"Matthew 25:31–46 — the sheep and the goats","talk":["Younger children: Jesus says that when we help someone who is hungry or lonely, we are really helping Him. Who is that person for our family?","Older children: Nebuchadnezzar's statue of gold and iron is shattered by a stone “cut without hands.” What kingdom is that, and how does it end up filling the earth?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"November 23, 2026","theme":"Even If He Does Not","ot":"Daniel 3:1–30 — Shadrach, Meshach and Abednego: “Our God is able to deliver us — but if not, we still will not bow”","nt":"Revelation 20:1–15 — The dead are judged; death and Hades are thrown into the lake of fire","extra":"","talk":["Younger children: The three men said they would not bow down even if God did not rescue them. Who did the king see walking in the fire with them?","Older children: “But if not” may be the bravest two words in the Old Testament. What does faith look like when it is not backed by a guaranteed rescue?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"November 24, 2026","theme":"Behold, I Am Making All Things New","ot":"Daniel 4:1–37 — Nebuchadnezzar is humbled to the grass and then lifts his eyes to heaven","nt":"Revelation 21:1–8 — A new heaven and a new earth; He will wipe away every tear","extra":"","talk":["Younger children: God promises to wipe away every tear. What tears would you most like Him to wipe away?","Older children: The proudest king in the world ends up praising God. What finally broke through — argument, or being brought low?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"November 25, 2026","theme":"Weighed in the Balances","ot":"Daniel 5:1–30 — A hand writes on the wall at Belshazzar's feast: Mene, Mene, Tekel, Parsin","nt":"Revelation 21:9–27 — The city has no temple, for the Lord God and the Lamb are its temple","extra":"","talk":["Younger children: A hand appeared and wrote on the wall in the middle of a party. Why do you think that frightened the king so much?","Older children: Belshazzar knew his father's story and learned nothing from it. What are you in danger of knowing but not learning?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"November 26, 2026","theme":"Thanksgiving Day — The Lions' Den","ot":"Daniel 6:1–28 — Daniel prays with his windows open toward Jerusalem, three times a day, as he had always done","nt":"Revelation 22:1–21 — The river of the water of life; “Surely I am coming soon”","extra":"","talk":["Younger children: Daniel kept praying even when it was against the law. What did God send to shut the lions' mouths?","Older children: Daniel's courage was really just his ordinary habit, continued on a bad day. What ordinary habit is God building in you now for a day you cannot see?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"November 27, 2026","theme":"A New Church Year Begins to Dawn","ot":"Isaiah 1:1–28 — Isaiah opens: “Come now, let us reason together… though your sins are like scarlet”","nt":"1 Peter 1:1–12 — Born again to a living hope through the resurrection of Jesus Christ","extra":"","talk":["Younger children: God says sins that are bright red can be made white as snow. Who makes them clean?","Older children: Peter calls it “a living hope.” What is the difference between hope that is alive and hope that is only wishful?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"November 28, 2026","theme":"They Shall Beat Their Swords into Plowshares","ot":"Isaiah 2:1–22 — All nations shall flow to the mountain of the LORD; they shall learn war no more","nt":"1 Peter 1:13–25 — Set your hope fully on the grace that will be brought to you at the revealing of Jesus Christ","extra":"","talk":["Younger children: Isaiah says that one day people will turn their weapons into farm tools. What will the world be like then?","Older children: Tomorrow the Church Year starts over with Advent. Looking back across this year of readings, what has changed in how you hear them?","Look ahead: Tomorrow is the First Sunday in Advent and a new Church Year — Series B begins, and the Gospel is Mark 11:1–10."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-11-22.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/525","yt_url":"https://www.youtube.com/results?search_query=LSB%20525%20Crown%20Him%20with%20Many%20Crowns%20hymn"}};
var SHOW_UPCOMING = true;
var KEYS = Object.keys(WEEKS).sort();

function keyDate(k){ var p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(dt, n){ return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()+n); }
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function visibleKeys(today){
  if (SHOW_UPCOMING) return KEYS.slice();
  var t = midnight(today).getTime();
  return KEYS.filter(function(k){ return keyDate(k).getTime() <= t; });
}

/* Which week covers `today`? Returns {key, status} where status is
   'current'  today falls inside that week
   'before'   the series hasn't started yet -> first week
   'after'    the series has ended -> last week                      */
function pickWeek(today){
  var t = midnight(today).getTime();
  var vis = visibleKeys(today);
  if (!vis.length) return {key: KEYS[0], status: 'before'};
  for (var i = 0; i < vis.length; i++){
    var s = keyDate(vis[i]).getTime();
    var e = addDays(keyDate(vis[i]), 6).getTime();
    if (t >= s && t <= e) return {key: vis[i], status: 'current'};
  }
  if (t < keyDate(vis[0]).getTime()) return {key: vis[0], status: 'before'};
  return {key: vis[vis.length-1], status: 'after'};
}

/* Which day tab should open by default? */
function pickDay(key, today){
  var t = midnight(today).getTime();
  var s = keyDate(key).getTime();
  var e = addDays(keyDate(key), 6).getTime();
  if (t < s || t > e) return 'overview';
  return ['sun','mon','tue','wed','thu','fri','sat'][today.getDay()];
}

if (typeof module !== 'undefined') { module.exports = {WEEKS:WEEKS, KEYS:KEYS, pickWeek:pickWeek, pickDay:pickDay, visibleKeys:visibleKeys}; }

<script>
/* ---- rendering ---- */
function esc(s){ var d = document.createElement('div'); d.textContent = (s == null ? '' : s); return d.innerHTML; }
function lord(s){ return String(s).replace(/LORD/g, 'L<span class="sc">ORD</span>'); }
function escL(s){ return lord(esc(s)); }

var state = { key: null, day: 'overview' };

function heading(w){
  document.documentElement.style.setProperty('--season-bg', w.season_bg);
  document.documentElement.style.setProperty('--season-fg', w.season_fg);
  document.documentElement.style.setProperty('--rule', w.rule);
  document.getElementById('range').textContent =
    'Week of ' + w.range_label + (w.sunday_name ? ' · ' + w.sunday_name : '');
  document.getElementById('theme').textContent = w.week_theme ? 'This week: ' + w.week_theme : '';
  document.getElementById('theme').style.display = w.week_theme ? '' : 'none';
  document.getElementById('season').textContent =
    w.season ? 'Season of ' + w.season + ' ✠ Liturgical Color: ' + w.color : '';
}

function propersCard(w){
  var h = '<div class="card"><h2>Sunday’s Propers' + (w.proper_label ? ' — ' + esc(w.proper_label) : '') + '</h2>';
  h += '<h3>Readings</h3><p>' + esc(w.sunday_readings) + '</p>';
  if (w.introit_lines.length){
    h += '<h3>Introit — ' + esc(w.introit_cite) + '</h3>';
    for (var i = 0; i < w.introit_lines.length; i++){
      h += '<p' + (i % 2 ? ' class="responsive-b"' : '') + '>' + lord(w.introit_lines[i]) + '</p>';
    }
  } else if (w.introit_note){
    h += '<h3>Introit</h3><p><em>' + esc(w.introit_note) + '</em></p>';
  }
  if (w.collect) h += '<h3>Collect of the Day</h3><p>' + esc(w.collect) + '</p>';
  if (w.gradual_lines.length){
    h += '<h3>Gradual — ' + esc(w.gradual_cite) + '</h3><p>' +
         esc(w.gradual_lines.join(' ')).replace(/&lt;\/?b&gt;/g, '') + '</p>';
  }
  if (w.next_sunday_readings){
    h += '<h3>Next Sunday’s Readings' + (w.next_sunday_label ? ' (' + esc(w.next_sunday_label) + ')' : '') + '</h3>';
    h += '<p>' + esc(w.next_sunday_readings) + '</p>';
  }
  return h + '</div>';
}

function overview(w){
  var h = '';
  if (!w.ready){
    var past = addDays(keyDate(w.key), 6).getTime() < midnight(new Date()).getTime();
    if (past){
      h += '<div class="notice"><strong>Full devotions were not published for this week.</strong> ' +
           'The Sunday readings and memory verse appointed for it are below, and the daily readings ' +
           'for these dates can be prayed from the LSB Daily Lectionary (p. 299).</div>';
    } else {
      h += '<div class="notice"><strong>This week’s devotions are still being prepared.</strong> ' +
           'The Sunday readings and memory verse below are already set; the daily readings, questions, ' +
           'and hymn are normally posted by the Friday before. They appear here automatically once ready.</div>';
    }
  }
  if (w.ready){
    h += '<div class="card"><h2>How to Use This Week’s Devotions</h2>' +
      '<p>Gather once a day — at breakfast, supper, or bedtime, whenever your family is already together. ' +
      'Ten minutes is plenty. Here is the simple order:</p>' +
      '<ol class="order">' +
      '<li><strong>Begin with the Invocation.</strong> Speak together: <em>“In the name of the Father and of the ✠ Son and of the Holy Spirit. Amen.”</em> ' +
      'These are the same words spoken at your Baptism — you may make the sign of the cross as a reminder of it.</li>' +
      '<li><strong>Say the memory verse together</strong> (just below). By Saturday, even the littlest ones will know parts of it.</li>' +
      '<li><strong>Read today’s readings</strong> from the day’s tab above — or just one of them if time is short.</li>' +
      '<li><strong>Talk about it</strong> using the day’s questions for younger and older children.</li>' +
      '<li><strong>Sing the hymn stanza</strong> for the week (links to the tune are below).</li>' +
      '<li><strong>Pray.</strong> Pray for the day’s theme, add your family’s own petitions, and close with the Lord’s Prayer.</li>' +
      '<li><strong>End with the blessing:</strong> <em>“Let us bless the Lord. Thanks be to God.”</em></li>' +
      '</ol>' +
      '<p class="reassure">Missed a day? Just pick up where you are — the goal is God’s Word in your home, not a perfect record.</p>';
  } else {
    h += '<div class="card">';
  }
  if (w.memory_ref){
    h += '<h3>Memory Verse for the Week — ' + esc(w.memory_ref) + '</h3>' +
         '<div class="verse">“' + escL(w.memory_text) + '”</div>';
  }
  if (w.hymn_title){
    h += '<h3>Hymn of the Week — “' + esc(w.hymn_title) + '” (' + esc(w.hymn_num) + ')</h3>' +
         '<p class="hymn">' + esc(w.hymn_full) + '</p>';
    if (w.hymnary_url){
      h += '<p class="hymn-links"><a href="' + w.hymnary_url + '" target="_blank" rel="noopener">' +
           '♪ Sheet music, full text &amp; audio (Hymnary.org)</a> &nbsp;·&nbsp; ' +
           '<a href="' + w.yt_url + '" target="_blank" rel="noopener">▶ Listen on YouTube</a></p>';
    }
  }
  if (w.learn_title){
    h += '<h3>Learn by Heart — ' + esc(w.learn_title) +
         (w.learn_cite ? ' (' + esc(w.learn_cite) + ')' : '') + '</h3>' +
         '<p><em>“' + esc(w.learn_quote) + '”</em></p>';
  }
  h += '</div>';

  h += propersCard(w);

  if (w.week_at_home){
    h += '<div class="card"><h2>This Week at Home</h2><p>' + escL(w.week_at_home) + '</p></div>';
  }
  if (w.ready){
    h += '<div class="card"><h2>Daily Prayer Themes (LSB)</h2><ul>';
    h += '<li><strong>Sunday:</strong> the joy of the resurrection; fruit of faith in all who heard the Word today</li>';h += '<li><strong>Monday:</strong> our Baptism, callings, and daily work; schools; good government and peace</li>';h += '<li><strong>Tuesday:</strong> deliverance from temptation and evil; the addicted and despairing</li>';h += '<li><strong>Wednesday:</strong> marriage and family; parents and children; our home and community</li>';h += '<li><strong>Thursday:</strong> the Church, pastors, teachers, and missionaries; thanksgiving for the Sacrament</li>';h += '<li><strong>Friday:</strong> the preaching of the cross; the persecuted; the sick and the dying</li>';h += '<li><strong>Saturday:</strong> faithfulness to the end; hearts made ready for the Lord\'s Day</li>';
    h += '</ul></div>';
  }
  if (w.kids){
    h += '<div class="card kids-card"><h2>Kids in the Divine Service — ' + esc(w.kids.title) + '</h2>' +
         '<p>' + escL(w.kids.what) + '</p>' +
         (w.kids.why ? '<p>' + escL(w.kids.why) + '</p>' : '') +
         '<p><strong>Parents:</strong> <em>' + escL(w.kids.parents) + '</em></p>' +
         '<p class="kids-src">From “KIDS in the Divine Service,” © 2017 LCMS Worship — reproducible by LCMS congregations.</p>' +
         '</div>';
  }
  return h;
}

function dayPanel(w, d){
  var h = '<div class="card"><div class="datebar">' + esc(d.name) + ', ' + esc(d.date) +
          (d.name === 'Sunday' && w.sunday_name ? ' — ' + esc(w.sunday_name) : '') + '</div>' +
          '<h2>' + esc(d.theme) + '</h2>' +
          '<h3>Readings — LSB p. 299</h3><ul>' +
          '<li><strong>Old Testament:</strong> ' + escL(d.ot) + '</li>' +
          '<li><strong>New Testament:</strong> ' + escL(d.nt) + '</li>';
  if (d.extra) h += '<li><strong>From today’s Divine Service:</strong> ' + escL(d.extra) + '</li>';
  h += '</ul><h3>Talk About It</h3><ul>';
  for (var i = 0; i < d.talk.length; i++) h += '<li>' + escL(d.talk[i]) + '</li>';
  h += '</ul><h3>Pray</h3><p>' + esc(d.pray) + ' Then the Lord’s Prayer.</p></div>';
  return h;
}

function footer(w){
  var h = '<div class="actions">';
  if (w.pdf) h += '<a href="' + w.pdf + '" target="_blank" rel="noopener">⬇ Download the printable handout (PDF)</a>';
  h += '<button onclick="window.print()">⎙ Print this week</button></div>';
  h += '<details class="all"><summary>Browse all weeks</summary><ul>';
  var vis = visibleKeys(new Date());
  for (var i = 0; i < vis.length; i++){
    var x = WEEKS[vis[i]];
    h += '<li><a href="#' + x.key + '">' + esc(x.range_label) + '</a> — ' + esc(x.sunday_name) +
         (x.ready ? '' : ' <em>(in preparation)</em>') + '</li>';
  }
  h += '</ul></details>';
  h += '<p class="foot">This page updates itself: it always opens to the current week of the Church Year.<br>' +
       'Scripture quotations from the ESV® Bible, © 2001 by Crossway. Introit, Collect, and Gradual from ' +
       'Lutheran Service Book, © 2006 Concordia Publishing House. Daily readings follow the LSB Daily Lectionary (p. 299).</p>';
  return h;
}

function tabs(w){
  var el = document.getElementById('tabs');
  if (!w.ready || !w.days.length){ el.innerHTML = ''; el.style.display = 'none'; return; }
  el.style.display = '';
  var today = new Date(), ids = ['sun','mon','tue','wed','thu','fri','sat'];
  var todayId = pickDay(w.key, today);
  var h = '<button data-day="overview">This Week</button>';
  for (var i = 0; i < w.days.length; i++){
    var id = ids[i];
    h += '<button data-day="' + id + '">' + esc(w.days[i].abbr) +
         (id === todayId ? ' <span class="dot">•</span>' : '') + '</button>';
  }
  el.innerHTML = h;
  var btns = el.querySelectorAll('button');
  for (var j = 0; j < btns.length; j++){
    btns[j].onclick = function(){ go(state.key, this.getAttribute('data-day')); };
  }
}

function render(){
  var w = WEEKS[state.key];
  heading(w);
  tabs(w);
  var body;
  if (state.day === 'overview' || !w.ready){
    body = overview(w);
  } else {
    var ids = ['sun','mon','tue','wed','thu','fri','sat'];
    var idx = ids.indexOf(state.day);
    body = (idx >= 0 && w.days[idx]) ? dayPanel(w, w.days[idx]) : overview(w);
  }
  document.getElementById('main').innerHTML = '<div class="panel">' + body + '</div>' + footer(w);
  var btns = document.querySelectorAll('nav.days button');
  for (var i = 0; i < btns.length; i++){
    btns[i].className = (btns[i].getAttribute('data-day') === state.day) ? 'active' : '';
  }
  var vis = visibleKeys(new Date()), pos = vis.indexOf(state.key);
  document.getElementById('prev').disabled = pos <= 0;
  document.getElementById('next').disabled = pos < 0 || pos >= vis.length - 1;
  document.getElementById('now').hidden = (state.key === pickWeek(new Date()).key);
  document.getElementById('picker').value = state.key;
  window.scrollTo(0, 0);
}

function go(key, day){
  state.key = key; state.day = day || 'overview';
  location.hash = key + (state.day !== 'overview' ? '/' + state.day : '');
  render();
}

function fromHash(){
  var h = location.hash.replace(/^#/, '');
  if (!h) return null;
  var parts = h.split('/');
  if (!WEEKS[parts[0]]) return null;
  return { key: parts[0], day: parts[1] || 'overview' };
}

function init(){
  var picker = document.getElementById('picker');
  var vis = visibleKeys(new Date()), ph = '';
  for (var i = 0; i < vis.length; i++){
    var x = WEEKS[vis[i]];
    ph += '<option value="' + x.key + '">' + esc(x.range_label) + ' — ' + esc(x.sunday_name) + '</option>';
  }
  picker.innerHTML = ph;
  picker.onchange = function(){ go(this.value, 'overview'); };
  document.getElementById('prev').onclick = function(){
    var v = visibleKeys(new Date()), p = v.indexOf(state.key); if (p > 0) go(v[p-1], 'overview');
  };
  document.getElementById('next').onclick = function(){
    var v = visibleKeys(new Date()), p = v.indexOf(state.key); if (p >= 0 && p < v.length-1) go(v[p+1], 'overview');
  };
  document.getElementById('now').onclick = function(){
    var c = pickWeek(new Date()); go(c.key, pickDay(c.key, new Date()));
  };
  window.addEventListener('hashchange', function(){
    var f = fromHash();
    if (f && (f.key !== state.key || f.day !== state.day)){ state = f; render(); }
  });

  var f = fromHash();
  if (f){ state = f; }
  else {
    var c = pickWeek(new Date());
    state.key = c.key;
    state.day = pickDay(c.key, new Date());
  }
  render();
}
init();
</script>
</body>
</html>
