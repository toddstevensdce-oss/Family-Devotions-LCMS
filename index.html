dren: Ephesians 2 says we were dead, not merely sick. How is that like a soaked altar that only God's fire can light?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"September 3, 2026","theme":"The Still, Small Voice","ot":"1 Kings 19:1–21 — Elijah runs, wants to die, and God comes in a low whisper","nt":"Ephesians 3:1–21 — That you may know the love of Christ that surpasses knowledge","extra":"","talk":["Younger children: God was not in the wind, the earthquake, or the fire. How did He come to Elijah? How does He come to us?","Older children: Right after his greatest victory, Elijah collapsed. What does God do first for him — and what does that tell you about how God treats us when we are exhausted?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"September 4, 2026","theme":"A Prophet Taken Up, a Mantle Handed On","ot":"2 Kings 2:1–18 — Elijah is taken to heaven; Elisha receives a double portion","nt":"Ephesians 4:1–24 — One Lord, one faith, one Baptism; grow up in every way into Christ","extra":"","talk":["Younger children: Elisha caught Elijah's coat as it fell. Who has handed the faith down to you?","Older children: “One Lord, one faith, one Baptism.” How is the Church itself a mantle handed from one generation to the next?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"September 5, 2026","theme":"Bad Water Healed, an Empty Jar Filled","ot":"2 Kings 2:19–25; 4:1–7 — Elisha heals a poisoned spring; a widow's oil fills every borrowed vessel","nt":"Ephesians 4:25—5:14 — Put away falsehood; be kind, tenderhearted, forgiving one another","extra":"","talk":["Younger children: The widow's oil kept pouring until there were no more jars. What does that tell you about how much God gives?","Older children: Paul says to forgive as God in Christ forgave you. How is forgiveness like oil that only stops when the jars run out?","Look ahead: Read part of tomorrow's Gospel, Matthew 18:1–14 (become like children; the lost sheep), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-08-30.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/688","yt_url":"https://www.youtube.com/results?search_query=LSB%20688%20%E2%80%9CCome%2C%20Follow%20Me%2C%E2%80%9D%20the%20Savior%20Spake%20hymn"},"2026-09-06":{"key":"2026-09-06","ready":true,"range_label":"September 6–12, 2026","sunday_name":"The Fifteenth Sunday after Pentecost (Proper 18)","sunday_date":"September 6, 2026","proper_label":"Proper 18, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"Become like little children — and go after the one who wandered off","sunday_readings":"Ezekiel 33:7–9 · Psalm 32:1–7 · Romans 13:1–10 · Matthew 18:1–20","next_sunday_label":"Proper 19","next_sunday_readings":"Genesis 50:15–21 · Psalm 103:1–12 · Romans 14:1–12 · Matthew 18:21–35","memory_ref":"Jude 24–25","memory_text":"Now to Him who is able to keep you from stumbling and to present you blameless before the presence of His glory with great joy, to the only God, our Savior, through Jesus Christ our Lord, be glory, majesty, dominion, and authority, before all time and now and forever. Amen.","hymn_title":"Lord Jesus Christ, Be Present Now","hymn_num":"LSB 902","hymn_full":"Lord Jesus Christ, be present now;\nOur hearts in true devotion bow.\nYour Spirit send with grace divine,\nAnd let Your truth within us shine.\n\nUnseal our lips to sing Your praise\nIn endless hymns through all our days;\nIncrease our faith and light our minds;\nAnd set us free from doubt that blinds.\n\nThen shall we join the hosts that cry,\n“O holy, holy Lord Most High!”\nAnd in the light of that blest place\nWe then shall see You face to face.","learn_title":"Holy Baptism — What benefits does Baptism give?","learn_cite":"LSB p. 325","learn_quote":"It works forgiveness of sins, rescues from death and the devil, and gives eternal salvation to all who believe this, as the words and promises of God declare.","introit_cite":"Psalm 92:1–4; antiphon: v. 5","introit_lines":["<b>How great are your works, O LORD!<\/b>","<b>Your thoughts are very deep!<\/b>","It is good to give thanks to the LORD,","to sing praises to your name, O Most High;","to declare your steadfast love in the morning,","and your faithfulness by night,","to the music of the lute and the harp,","to the melody of the lyre.","For you, O LORD, have made me glad by your work;","at the works of your hands I sing for joy.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>How great are your works, O LORD!<\/b>","<b>Your thoughts are very deep!<\/b>"],"introit_note":"","collect":"O God, from whom all good proceeds, grant to us, Your humble servants, Your holy inspiration, that we may set our minds on the things that are right and, by Your merciful guiding, accomplish them; through Jesus Christ, Your Son, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Psalm 34:9, 19","gradual_lines":["Oh, fear the LORD, you his saints,","for those who fear him have no lack!","Many are the afflictions of the righteous,","but the LORD delivers him out of them all."],"week_at_home":"The disciples ask who is greatest, and Jesus answers by putting a child in front of them. Then He tells of a shepherd who leaves ninety-nine sheep to go find one that wandered off, because it is not the Father's will that one of these little ones should perish. This week Elisha's story is full of small, overlooked people whom God notices: a grieving mother, a foreign soldier with a skin disease, a servant girl, a man who lost a borrowed axe head. Ask one another: “Who is the person our family is most likely to overlook — and what would going after them look like?”","kids":{"title":"What is the “church”?","what":"When someone says “church,” we usually think of a building people go to. But the Lutheran Confessions teach that the church is the assembly of all believers among whom the Gospel is preached in its purity and the holy Sacraments are administered according to the Gospel. The church is so much more than a building!","why":"So why does the building matter? Because it is a place where God has promised to come to us in His Word and Sacraments. This week Jesus says, “Where two or three are gathered in My name, there am I among them” — the smallest gathering of His people, and He is there.","parents":"Point out the Gospel-rich symbols in your sanctuary — the altar, the windows, the banners. Remind your children that the Lord truly comes to us here and brings what we most need: the forgiveness of sins."},"days":[{"name":"Sunday","abbr":"Sun","date":"September 6, 2026","theme":"Who Is the Greatest? — Jesus Sets a Child in Front of Them","ot":"2 Kings 4:8–22, 32–37 — A grieving mother lays her dead son on Elisha's bed, and God restores him","nt":"Ephesians 5:15–33 — Look carefully how you walk; husbands, love your wives as Christ loved the Church","extra":"Matthew 18:1–20 — become like children; the lost sheep; where two or three are gathered","talk":["Younger children: Jesus put a little child in the middle of the grown-ups to answer their question. What does that say about how God sees you?","Older children: Jesus says it is not the Father's will that one little one perish. How does the Shunammite mother refusing to give up on her son echo that?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"September 7, 2026","theme":"Death in the Pot, and a Little Servant Girl Who Spoke Up","ot":"2 Kings 4:38—5:8 — Poison in the stew is healed; a captive girl points Naaman to the prophet","nt":"Ephesians 6:1–24 — Children, obey your parents; put on the whole armor of God","extra":"","talk":["Younger children: A young servant girl told Naaman where to find help. Have you ever told someone about Jesus? What could you say?","Older children: The girl had every reason to stay silent — she was a prisoner of Naaman's army. What made her speak? What makes you not?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"September 8, 2026","theme":"Wash and Be Clean — Naaman's Wounded Pride","ot":"2 Kings 5:9–27 — Naaman is angry at a simple command, then washes and is healed","nt":"Philippians 1:1–20 — To live is Christ, and to die is gain","extra":"","talk":["Younger children: Naaman wanted something big and impressive. God gave him plain water and a promise. Where else does God use plain water?","Older children: Naaman almost missed his healing because the cure was too ordinary. Where are you tempted to want a more impressive religion than Word, water, bread and wine?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"September 9, 2026","theme":"Those Who Are with Us Are More Than Those with Them","ot":"2 Kings 6:1–23 — An axe head floats; Elisha's servant sees the hills full of fiery chariots","nt":"Philippians 1:21—2:11 — Christ humbled Himself to the point of death, even death on a cross","extra":"","talk":["Younger children: Elisha's helper was scared until God opened his eyes. What did he see? Who is protecting you?","Older children: Elisha prayed “open his eyes.” Philippians says Christ emptied Himself. What do you have to see rightly before humility looks like strength instead of weakness?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"September 10, 2026","theme":"Zeal Without a Heart","ot":"2 Kings 9:1–13; 10:18–29 — Jehu destroys Baal's worship but does not turn from Jeroboam's sins","nt":"Philippians 2:12–30 — Work out your salvation, for it is God who works in you","extra":"","talk":["Younger children: Jehu did some right things for the wrong reasons. Does God care about why we do things, or only what we do?","Older children: Jehu's obedience was loud and partial. Paul says God works in you both to will and to work. What is the difference between reform and repentance?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"September 11, 2026","theme":"The Doors of the House Are Opened Again","ot":"2 Chronicles 29:1–24 — Young Hezekiah reopens and cleanses the temple his father had shut","nt":"Philippians 3:1–21 — Whatever gain I had, I count as loss for the sake of Christ","extra":"","talk":["Younger children: Hezekiah's dad had locked up God's house. The first thing Hezekiah did as king was open it. What does that say about what mattered most to him?","Older children: Paul counts his impressive résumé as loss. Hezekiah threw out what his father treasured. What might need clearing out of our home?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"September 12, 2026","theme":"Joyful Giving, Heaps upon Heaps","ot":"2 Chronicles 31:1–21 — The people bring so many gifts that Hezekiah has to build storerooms","nt":"Philippians 4:1–23 — Rejoice in the Lord always; I have learned to be content","extra":"","talk":["Younger children: The people gave so much that there was nowhere to put it all! What is something our family could give away this week?","Older children: Paul says he has learned contentment in plenty and in hunger. How does contentment actually make generosity possible?","Look ahead: Read part of tomorrow's Gospel, Matthew 18:21–35 (the unforgiving servant), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-09-06.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/902","yt_url":"https://www.youtube.com/results?search_query=LSB%20902%20Lord%20Jesus%20Christ%2C%20Be%20Present%20Now%20hymn"},"2026-09-13":{"key":"2026-09-13","ready":true,"range_label":"September 13–19, 2026","sunday_name":"The Sixteenth Sunday after Pentecost (Proper 19)","sunday_date":"September 13, 2026","proper_label":"Proper 19, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"Seventy times seven — a debt no one could pay, cancelled","sunday_readings":"Genesis 50:15–21 · Psalm 103:1–12 · Romans 14:1–12 · Matthew 18:21–35","next_sunday_label":"Proper 20","next_sunday_readings":"Isaiah 55:6–9 · Psalm 27:1–9 · Philippians 1:12–14, 19–30 · Matthew 20:1–16","memory_ref":"Psalm 143:8","memory_text":"Let me hear in the morning of Your steadfast love, for in You I trust. Make me know the way I should go, for to You I lift up my soul.","hymn_title":"Our Father, Who from Heaven Above","hymn_num":"LSB 766","hymn_full":"Our Father, who from heav'n above\nBids all of us to live in love\nAs members of one family\nAnd pray to You in unity,\nTeach us no thoughtless words to say\nBut from our inmost hearts to pray.\n\nForgive our sins, Lord, we implore,\nThat they may trouble us no more;\nWe too will gladly those forgive\nWho hurt us by the way they live.\nHelp us in our community\nTo serve each other willingly.","learn_title":"The Fifth Petition of the Lord's Prayer","learn_cite":"LSB p. 324","learn_quote":"We pray in this petition that our Father in heaven would not look at our sins, or deny our prayer because of them. We are neither worthy of the things for which we pray, nor have we deserved them, but we ask that He would give them all to us by grace.","introit_cite":"Psalm 143:1–2; antiphon: v. 9","introit_lines":["<b>Deliver me from my enemies, O LORD!<\/b>","<b>I have fled to you for refuge.<\/b>","Hear my prayer, O LORD; give ear to my pleas for mercy!","In your faithfulness answer me, in your righteousness!","Enter not into judgment with your servant,","for no one living is righteous before you.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>Deliver me from my enemies, O LORD!<\/b>","<b>I have fled to you for refuge.<\/b>"],"introit_note":"","collect":"O God, our refuge and strength, the author of all godliness, hear the devout prayers of Your Church, especially in times of persecution, and grant that what we ask in faith we may obtain; through Jesus Christ, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Psalm 34:9, 19","gradual_lines":["Oh, fear the LORD, you his saints,","for those who fear him have no lack!","Many are the afflictions of the righteous,","but the LORD delivers him out of them all."],"week_at_home":"Peter thinks he is being generous when he offers to forgive seven times. Jesus answers seventy-seven, and then tells of a servant forgiven a debt he could never have repaid in a hundred lifetimes — who then throttles a man over pocket change. This week the readings give the astonishing case of Manasseh, the worst king Judah ever had, who repents in a foreign prison and is forgiven. Ask one another: “What has God forgiven in us that we would be ashamed to say out loud — and who are we still holding something against?”","kids":{"title":"What does “redemption” mean?","what":"“Redemption” comes from the word “redeem,” which means “to buy back.” God's plan of redemption was His plan to buy us back from sin, death, and the power of the devil. Jesus kept the Law perfectly and died on the cross in our place. He paid the high price for sin and bought us back — and then rose from the dead to prove it.","why":"This week's Gospel is about a debt. The servant owed ten thousand talents, more money than he could earn in many lifetimes, and the king simply cancelled it. That is what redemption means: not a smaller bill, but a paid one.","parents":"What God has done for us in Jesus reflects the fatherly love He has for all people. Share that love with your children through the means the Lord has given — Word and Sacrament — where we receive the real fruits of redemption."},"days":[{"name":"Sunday","abbr":"Sun","date":"September 13, 2026","theme":"Seventy Times Seven","ot":"2 Chronicles 32:1–22 — Sennacherib mocks; Hezekiah spreads the letter before the LORD and prays","nt":"Colossians 1:1–23 — He has delivered us from the domain of darkness and transferred us to the kingdom of His beloved Son","extra":"Matthew 18:21–35 — the unforgiving servant","talk":["Younger children: Peter thought forgiving seven times was a lot. What did Jesus say instead? Is that a number you could count to?","Older children: Hezekiah answered a threat by laying it out in front of God. What would it look like to bring a grudge to God the same way?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"September 14, 2026","theme":"The Worst King Repents","ot":"2 Chronicles 33:1–25 — Manasseh fills Jerusalem with evil, is taken in hooks to Babylon — and prays","nt":"Colossians 1:24—2:7 — Christ in you, the hope of glory; rooted and built up in Him","extra":"","talk":["Younger children: Manasseh did terrible things for many years. When he finally asked God for help, what did God do?","Older children: Manasseh's repentance is one of the most surprising verses in the Bible. Does anyone's sin put them beyond God's reach? What does that mean for someone you have written off?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"September 15, 2026","theme":"The Book That Had Been Lost in God's Own House","ot":"2 Chronicles 34:1–4, 8–11, 14–33 — Josiah repairs the temple and the Book of the Law is found and read aloud","nt":"Colossians 2:8–23 — See that no one takes you captive by philosophy and empty deceit","extra":"","talk":["Younger children: God's Word was lost inside God's own house! Where does our Bible live in our home — and when did we last open it?","Older children: Josiah tore his clothes when he heard the Law. Why is being shaken by Scripture sometimes the first sign it is working?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"September 16, 2026","theme":"A Passover Like No Other","ot":"2 Chronicles 35:1–7, 16–25 — Josiah keeps the greatest Passover since the days of Samuel","nt":"Colossians 3:1–25 — Forgive as the Lord has forgiven you; above all, put on love","extra":"","talk":["Younger children: Passover reminded God's people how He rescued them. What meal reminds us that Jesus rescued us?","Older children: Colossians 3:13 says forgive as the Lord forgave you. Where does the Lord's Supper come into an argument you are having?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"September 17, 2026","theme":"Exile — and a Door Left Open","ot":"2 Chronicles 36:1–23 — Jerusalem falls, yet the book ends with Cyrus saying, “Let him go up”","nt":"Colossians 4:1–18 — Continue steadfastly in prayer; let your speech always be gracious","extra":"","talk":["Younger children: The story looked like it ended sadly, but God had a plan to bring His people home. Who else did God bring home?","Older children: Chronicles ends mid-sentence with a way out. How is that a picture of the whole Old Testament waiting for Christ?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"September 18, 2026","theme":"Nehemiah Weeps, Then Prays, Then Asks","ot":"Nehemiah 1:1—2:10 — Nehemiah hears the walls are broken and mourns, fasts, and prays for days","nt":"1 Timothy 1:1–20 — Christ Jesus came into the world to save sinners, of whom I am the foremost","extra":"","talk":["Younger children: Nehemiah cried about a city he had never even seen. What makes you sad for other people?","Older children: Paul calls himself the foremost of sinners — present tense. How does that change the way he treats other sinners?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"September 19, 2026","theme":"Build in Spite of the Mockers","ot":"Nehemiah 2:11–20; 4:1–6 — Nehemiah surveys the ruins by night; Sanballat jeers at the work","nt":"1 Timothy 2:1–15 — Pray for all people, for kings and all in high positions","extra":"","talk":["Younger children: People laughed at Nehemiah for trying. Has anyone ever laughed at you for doing something good?","Older children: Paul says to pray even for rulers. Nehemiah worked under a mocking government. How do you serve faithfully where you are not welcome?","Look ahead: Read part of tomorrow's Gospel, Matthew 20:1–16 (the laborers in the vineyard), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-09-13.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/766","yt_url":"https://www.youtube.com/results?search_query=LSB%20766%20Our%20Father%2C%20Who%20from%20Heaven%20Above%20hymn"},"2026-09-20":{"key":"2026-09-20","ready":true,"range_label":"September 20–26, 2026","sunday_name":"The Seventeenth Sunday after Pentecost (Proper 20)","sunday_date":"September 20, 2026","proper_label":"Proper 20, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"The last will be first — God's generosity is not fairness, it is grace","sunday_readings":"Isaiah 55:6–9 · Psalm 27:1–9 · Philippians 1:12–14, 19–30 · Matthew 20:1–16","next_sunday_label":"Proper 21","next_sunday_readings":"Ezekiel 18:1–4, 25–32 · Psalm 25:1–10 · Philippians 2:1–4 (5–13) 14–18 · Matthew 21:23–27 (28–32)","memory_ref":"Nahum 1:7","memory_text":"The Lord is good, a stronghold in the day of trouble; He knows those who take refuge in Him.","hymn_title":"Salvation unto Us Has Come","hymn_num":"LSB 555","hymn_full":"Salvation unto us has come\nBy God's free grace and favor;\nGood works cannot avert our doom,\nThey help and save us never.\nFaith looks to Jesus Christ alone,\nWho did for all the world atone;\nHe is our one Redeemer.\n\nYet as the Law must be fulfilled\nOr we must die despairing,\nChrist came and has God's anger stilled,\nOur human nature sharing.\nHe has for us the Law obeyed\nAnd thus the Father's vengeance stayed\nWhich over us impended.","learn_title":"The Sacrament of the Altar — What is the benefit of this eating and drinking?","learn_cite":"LSB p. 326","learn_quote":"These words, “Given and shed for you for the forgiveness of sins,” show us that in the Sacrament forgiveness of sins, life, and salvation are given us through these words. For where there is forgiveness of sins, there is also life and salvation.","introit_cite":"Psalm 116:12–13, 15–16; antiphon: v. 17","introit_lines":["<b>I will offer to you the sacrifice of thanksgiving<\/b>","<b>and call on the name of the LORD.<\/b>","What shall I render to the LORD","for all his benefits to me?","I will lift up the cup of salvation","and call on the name of the LORD.","Precious in the sight of the LORD","is the death of his saints.","O LORD, I am your servant;","I am your servant, the son of your maidservant. You have loosed my bonds.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>I will offer to you the sacrifice of thanksgiving<\/b>","<b>and call on the name of the LORD.<\/b>"],"introit_note":"","collect":"Lord God, heavenly Father, since we cannot stand before You relying on anything we have done, help us trust in Your abiding grace and live according to Your Word; through Jesus Christ, Your Son, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Psalm 34:9, 19","gradual_lines":["Oh, fear the LORD, you his saints,","for those who fear him have no lack!","Many are the afflictions of the righteous,","but the LORD delivers him out of them all."],"week_at_home":"A landowner hires workers all day long and at six o'clock pays the man who worked one hour exactly what he pays the man who worked twelve. The all-day workers are furious — and they are right that it isn't fair. It isn't. It is grace, and grace is never fair. Isaiah says it plainly this Sunday: “My thoughts are not your thoughts.” This week Nehemiah's people rebuild a wall in fifty-two days and then stand for hours listening to God's Word and weeping. Ask one another: “When have we been annoyed that God was too generous with someone else?”","kids":{"title":"What is a “steward”?","what":"A steward is someone put in charge of something that belongs to another. If you are a babysitter, you are a steward for that child's parents. God has made us stewards, or keepers, of His creation — everything we have is His, given to us to use in love for Him.","why":"So why do Christians give? Not because we owe God for what He has done in Jesus — that debt is already settled. We give because the powerful Gospel is at work in us. This week's Gospel shows a master paying far more than anyone earned; everything we hold came to us the same way.","parents":"Talk about stewardship with your children. Help them discover how they might give from what they have — perhaps setting aside a portion of their own money each week — so they experience the joy of giving firsthand."},"days":[{"name":"Sunday","abbr":"Sun","date":"September 20, 2026","theme":"The Last Will Be First","ot":"Nehemiah 4:7–23 — The builders work with a tool in one hand and a weapon in the other","nt":"1 Timothy 3:1–16 — Great indeed is the mystery of godliness: He was manifested in the flesh","extra":"Matthew 20:1–16 — the laborers in the vineyard","talk":["Younger children: Everyone got paid the same, even the ones who came last. Was the owner being mean, or being kind?","Older children: The all-day workers were right that it wasn't fair. Why is it good news that God does not deal with us fairly?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"September 21, 2026","theme":"Fifty-Two Days","ot":"Nehemiah 5:1–16; 6:1–9, 15–16 — Nehemiah refuses to profit from his office; the wall is finished","nt":"1 Timothy 4:1–16 — Train yourself for godliness; set the believers an example","extra":"","talk":["Younger children: The wall took less than two months. Who did the people say really did it?","Older children: Nehemiah gave up food allowances he was entitled to. What does it cost a leader to refuse what he could rightly take?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"September 22, 2026","theme":"The Joy of the LORD Is Your Strength","ot":"Nehemiah 7:1–4; 8:1–18 — Ezra reads the Law from morning till midday and the people weep, then feast","nt":"1 Timothy 5:1–16 — Honor widows; care for your own household","extra":"","talk":["Younger children: The people cried when they heard God's Word, and then were told to go have a party. Why both?","Older children: They stood and listened for hours. What would it take for God's Word to hold your attention like that?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"September 23, 2026","theme":"A Long Memory of Mercy","ot":"Nehemiah 9:1–21 — The people confess, retelling how God fed and led them in the wilderness","nt":"1 Timothy 5:17—6:2 — The laborer deserves his wages; keep these rules without prejudice","extra":"","talk":["Younger children: The people remembered out loud all the ways God had helped them. Name three ways God has helped our family.","Older children: Their confession is mostly a list of God's kindness. How does remembering mercy make confession possible?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"September 24, 2026","theme":"Signing on the Dotted Line","ot":"Nehemiah 9:22–38 — The people make a binding covenant and seal it","nt":"1 Timothy 6:3–21 — Godliness with contentment is great gain; fight the good fight of the faith","extra":"","talk":["Younger children: The people wrote down a promise to God. What promise did God make to you at your Baptism?","Older children: “Godliness with contentment is great gain.” How is contentment the opposite of the vineyard workers' complaint?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"September 25, 2026","theme":"Prepare the Way of the Lord","ot":"Malachi 1:1–14 — Malachi rebukes offerings given carelessly, from the leftovers","nt":"Matthew 3:1–17 — John baptizes; the Father says, “This is My beloved Son”","extra":"","talk":["Younger children: At Jesus' Baptism, what did the Father say about Him? What did God say about you at your Baptism?","Older children: Malachi says they brought God the blind and lame animals. What do we give God out of our leftovers?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"September 26, 2026","theme":"Tested in the Wilderness","ot":"Malachi 2:1—3:5 — “I have loved you,” says the LORD — yet the priests despise His name","nt":"Matthew 4:1–11 — Jesus answers every temptation with “It is written”","extra":"","talk":["Younger children: How did Jesus fight back when the devil tempted Him? Do you know any Bible verses by heart?","Older children: Jesus was tempted right after the Father called Him beloved. Why does temptation often follow God's clearest assurances?","Look ahead: Read part of tomorrow's Gospel, Matthew 21:23–32 (the two sons), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-09-20.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/555","yt_url":"https://www.youtube.com/results?search_query=LSB%20555%20Salvation%20unto%20Us%20Has%20Come%20hymn"},"2026-09-27":{"key":"2026-09-27","ready":true,"range_label":"September 27 – October 3, 2026","sunday_name":"The Eighteenth Sunday after Pentecost (Proper 21)","sunday_date":"September 27, 2026","proper_label":"Proper 21, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"“Which of the two did the will of his father?” — repentance beats reputation","sunday_readings":"Ezekiel 18:1–4, 25–32 · Psalm 25:1–10 · Philippians 2:1–4 (5–13) 14–18 · Matthew 21:23–27 (28–32)","next_sunday_label":"Proper 22","next_sunday_readings":"Isaiah 5:1–7 · Psalm 80:7–19 · Philippians 3:4b–14 · Matthew 21:33–46","memory_ref":"Psalm 91:11–12","memory_text":"For He will command His angels concerning you to guard you in all your ways. On their hands they will bear you up, lest you strike your foot against a stone.","hymn_title":"At the Name of Jesus","hymn_num":"LSB 512","hymn_full":"At the name of Jesus\nEv'ry knee shall bow,\nEv'ry tongue confess Him\nKing of glory now.\n'Tis the Father's pleasure\nWe should call Him Lord,\nWho from the beginning\nWas the mighty Word.\n\nHumbled for a season,\nTo receive a name\nFrom the lips of sinners\nUnto whom He came,\nHe became a true man,\nBore our sin and shame;\nThe last Adam's blessing\nOur salvation came.\n\nName Him, Christians, name Him,\nWith love strong as death,\nBut with awe and wonder\nAnd with bated breath;\nHe is God the Savior,\nHe is Christ the Lord,\nEver to be worshiped,\nTrusted, and adored.","learn_title":"The Fourth Commandment","learn_cite":"LSB p. 321","learn_quote":"Honor your father and your mother. What does this mean? We should fear and love God so that we do not despise or anger our parents and other authorities, but honor them, serve and obey them, love and cherish them.","introit_cite":"Psalm 147:1–5; antiphon: v. 6","introit_lines":["<b>The LORD lifts up the humble;<\/b>","<b>he casts the wicked to the ground.<\/b>","Praise the LORD! For it is good to sing praises to our God;","for it is pleasant, and a song of praise is fitting.","The LORD builds up Jerusalem;","he gathers the outcasts of Israel.","He heals the brokenhearted","and binds up their wounds.","He determines the number of the stars;","he gives to all of them their names.","Great is our Lord, and abundant in power;","his understanding is beyond measure.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>The LORD lifts up the humble;<\/b>","<b>he casts the wicked to the ground.<\/b>"],"introit_note":"","collect":"Almighty God, You exalted Your Son to the place of all honor and authority. Enlighten our minds by Your Holy Spirit that, confessing Jesus as Lord, we may be led into all truth; through the same Jesus Christ, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Psalm 91:11; 103:1","gradual_lines":["For he will command his angels concerning you","to guard you in all your ways.","Bless the LORD, O my soul,","and all that is within me, bless his holy name!"],"week_at_home":"The chief priests demand to know who gave Jesus the right to do what He does. He answers with a question they will not touch, and then a story: one son says no and goes anyway; the other says “I go, sir,” and never moves. Which one did the father's will? This week Deuteronomy opens with Israel standing at the edge of the Promised Land — refusing to go in — while Matthew gives us the Sermon on the Mount. Ask one another: “Where have we said yes to God with our mouths this week and no with our feet?”","kids":{"title":"What is the “pulpit”?","what":"The pulpit is the raised place where the pastor preaches. The word comes from the Latin pulpitum, meaning “scaffold” — a platform lifted up high. Before microphones, raising the preacher helped everyone hear.","why":"Lifting the pulpit above everything else also shows the importance of proclaiming God's pure Word. In this Sunday's Gospel the leaders ask Jesus, “By what authority are You doing these things?” The pulpit answers that question every week: the pastor does not speak on his own authority, but delivers Christ's Word.","parents":"Before or after the service, let your children walk up to the pulpit and look out at the congregation, reminding them to be reverent in God's holy places. Before the sermon, remind them that pastor is about to preach God's Word."},"days":[{"name":"Sunday","abbr":"Sun","date":"September 27, 2026","theme":"By What Authority? — The Son Who Actually Went","ot":"Malachi 3:6—4:6 — “Return to Me, and I will return to you”; the sun of righteousness shall rise","nt":"Matthew 4:12–25 — Jesus begins to preach: “Repent, for the kingdom of heaven is at hand”","extra":"Matthew 21:23–27 (28–32) — the question of authority and the two sons","talk":["Younger children: One boy said no but went. The other said yes and stayed home. Which one really obeyed?","Older children: Jesus says tax collectors and prostitutes enter the kingdom ahead of the religious leaders. What is it about being obviously wrong that makes repentance easier?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"September 28, 2026","theme":"Blessed Are the Poor in Spirit","ot":"Deuteronomy 1:1–18 — Moses begins to retell the journey: “The LORD our God said to us at Horeb”","nt":"Matthew 5:1–20 — The Beatitudes; you are the salt of the earth and the light of the world","extra":"","talk":["Younger children: Jesus says the people God calls blessed are the sad, the gentle, and the hungry. Is that who you expected?","Older children: Salt and light both work by being different from what surrounds them. Where is that costly for you?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"September 29, 2026","theme":"The Day They Would Not Go In","ot":"Deuteronomy 1:19–36 — Israel refuses to enter the land: “You were not willing to go up”","nt":"Matthew 5:21–48 — You have heard that it was said… but I say to you","extra":"","talk":["Younger children: God told His people the land was theirs, and they were too afraid to go. What are you afraid of right now?","Older children: They believed the giants more than the promise. Where does Jesus, in Matthew 5, aim His commands — at hands, or at hearts?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"September 30, 2026","theme":"Pray Then Like This","ot":"Deuteronomy 1:37—2:15 — Even Moses is told he will not cross over; the LORD gives the land in His own way","nt":"Matthew 6:1–15 — Jesus gives the Lord's Prayer","extra":"","talk":["Younger children: Jesus taught us the exact words to pray. Which line of the Lord's Prayer is your favorite?","Older children: Moses accepted a “no” from God and kept leading. How does “Thy will be done” prepare you for that?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"October 1, 2026","theme":"Do Not Be Anxious","ot":"Deuteronomy 2:16–37 — Forty years pass; God provides at every step, and they lack nothing","nt":"Matthew 6:16–34 — Seek first the kingdom of God, and all these things will be added to you","extra":"","talk":["Younger children: Jesus points to birds and flowers. What has God given you today that you did not have to make?","Older children: Israel's forty years were an unbroken record of provision. Why is worry, in light of that history, a kind of forgetting?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"October 2, 2026","theme":"Judge Not — Ask, Seek, Knock","ot":"Deuteronomy 3:1–29 — Moses pleads to cross over and is told, “Enough! Speak no more of this”","nt":"Matthew 7:1–12 — Whatever you wish that others would do to you, do also to them","extra":"","talk":["Younger children: Jesus says to treat people the way you want to be treated. Who needs that from you tomorrow?","Older children: Moses' prayer got a firm no, and Jesus says “ask and it will be given.” How do those fit together?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"October 3, 2026","theme":"The House on the Rock","ot":"Deuteronomy 4:1–20 — “Now, O Israel, listen to the statutes… that you may live”","nt":"Matthew 7:13–29 — The narrow gate; the wise builder whose house stood in the storm","extra":"","talk":["Younger children: What made one house fall down and the other stand up in the storm?","Older children: Both builders heard the same words; only one did them. How is that the same point Jesus made on Sunday with the two sons?","Look ahead: Read part of tomorrow's Gospel, Matthew 21:33–46 (the wicked tenants), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-09-27.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/512","yt_url":"https://www.youtube.com/results?search_query=LSB%20512%20At%20the%20Name%20of%20Jesus%20hymn"},"2026-10-04":{"key":"2026-10-04","ready":true,"range_label":"October 4–10, 2026","sunday_name":"The Nineteenth Sunday after Pentecost (Proper 22)","sunday_date":"October 4, 2026","proper_label":"Proper 22, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"The stone the builders rejected has become the cornerstone","sunday_readings":"Isaiah 5:1–7 · Psalm 80:7–19 · Philippians 3:4b–14 · Matthew 21:33–46","next_sunday_label":"Proper 23","next_sunday_readings":"Isaiah 25:6–9 · Psalm 23 · Philippians 4:4–13 · Matthew 22:1–14","memory_ref":"Proverbs 22:6","memory_text":"Train up a child in the way he should go; even when he is old he will not depart from it.","hymn_title":"Christ Is Made the Sure Foundation","hymn_num":"LSB 909","hymn_full":"Christ is made the sure foundation,\nChrist, the head and cornerstone,\nChosen of the Lord and precious,\nBinding all the Church in one;\nHoly Zion's help forever\nAnd her confidence alone.\n\nTo this temple, where we call You,\nCome, O Lord of hosts, today;\nWith Your steadfast lovingkindness\nHear Your people as they pray.\nAnd Your fullest benediction\nShed within these walls alway.\n\nLaud and honor to the Father,\nLaud and honor to the Son,\nLaud and honor to the Spirit,\nEver three and ever one:\nOne in might and one in glory\nWhile unending ages run.","learn_title":"The Ninth Commandment","learn_cite":"LSB p. 322","learn_quote":"You shall not covet your neighbor's house. What does this mean? We should fear and love God so that we do not scheme to get our neighbor's inheritance or house, or get it in a way which only appears right, but help and be of service to him in keeping it.","introit_cite":"Psalm 118:22–24; antiphon: v. 1","introit_lines":["<b>Oh give thanks to the LORD, for he is good;<\/b>","<b>for his steadfast love endures forever!<\/b>","The stone that the builders rejected","has become the cornerstone.","This is the LORD's doing;","it is marvelous in our eyes.","This is the day that the LORD has made;","let us rejoice and be glad in it.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>Oh give thanks to the LORD, for he is good;<\/b>","<b>for his steadfast love endures forever!<\/b>"],"introit_note":"","collect":"Gracious God, You gave Your Son into the hands of sinful men who killed Him. Forgive us when we reject Your unfailing love, and grant us the fullness of Your salvation; through Jesus Christ, Your Son, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Psalm 91:11; 103:1","gradual_lines":["For he will command his angels concerning you","to guard you in all your ways.","Bless the LORD, O my soul,","and all that is within me, bless his holy name!"],"week_at_home":"Isaiah sings a love song about a vineyard that produced only wild grapes, and Jesus picks it straight up: tenants who beat the servants, kill the son, and imagine the vineyard will be theirs. Then He quotes Psalm 118 — the stone the builders threw away is the cornerstone. This week Deuteronomy gives the Ten Commandments and the Shema, and Matthew fills up with healings. Ask one another: “What has God entrusted to our family that we treat as if we owned it outright?”","kids":{"title":"What is the “altar”?","what":"The altar is the large, table-like object at the center front of the sanctuary. The word comes from the Latin altare, meaning “a place for offering sacrifices.” On top of many altars are five carved crosses — one for each of the five wounds of Christ.","why":"Those five crosses mark the altar as a place where no more blood sacrifices will ever happen. The only sacrifice needed was made on the cross. The altar is now a place where Christ gives out the forgiveness He earned. This week's Gospel calls Him the cornerstone the builders threw away — the stone everything else is built on.","parents":"During the service, direct your children's attention to the altar and point out that this is where God has promised to come to be with us. Afterward, take them up to look, reminding them to be reverent in God's holy place."},"days":[{"name":"Sunday","abbr":"Sun","date":"October 4, 2026","theme":"The Rejected Stone Becomes the Cornerstone","ot":"Deuteronomy 4:21–40 — “Take care lest you forget the covenant”; the LORD your God is a merciful God","nt":"Matthew 8:1–17 — A leper is cleansed; a centurion's servant is healed by a word","extra":"Matthew 21:33–46 — the wicked tenants and the cornerstone","talk":["Younger children: The builders threw a stone away, and it turned out to be the most important stone of all. Who is that stone?","Older children: The tenants wanted the vineyard without the owner. Where does that temptation show up in a life that looks religious from outside?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"October 5, 2026","theme":"The Ten Commandments, Spoken Again","ot":"Deuteronomy 5:1–21 — Moses repeats the Ten Commandments to a new generation","nt":"Matthew 8:18–34 — “Follow Me”; Jesus stills the storm and the demons obey Him","extra":"","talk":["Younger children: How many commandments are there? Can you name three?","Older children: This generation had not stood at Sinai themselves. Why does each generation need the commandments spoken to it directly?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"October 6, 2026","theme":"Hear, O Israel — Talk of Them When You Sit at Home","ot":"Deuteronomy 5:22—6:9 — The Shema: love the LORD with all your heart; teach these words to your children","nt":"Matthew 9:1–17 — Your sins are forgiven; new wine goes into fresh wineskins","extra":"","talk":["Younger children: God tells parents to talk about Him at home, on the road, at bedtime, in the morning. Is that what we are doing right now?","Older children: Deuteronomy 6 is where family devotions come from. Why does God tie faith so tightly to ordinary household conversation?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"October 7, 2026","theme":"When Your Son Asks, “What Is This?”","ot":"Deuteronomy 6:10–25 — “We were Pharaoh's slaves, and the LORD brought us out” — the answer to give your children","nt":"Matthew 9:18–38 — The harvest is plentiful, but the laborers are few","extra":"","talk":["Younger children: If a friend asked why we go to church, what would you say?","Older children: God gives Israel a script for their children's questions, and it is a rescue story. What is the one-sentence version of your rescue story?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"October 8, 2026","theme":"Not Because You Were Great","ot":"Deuteronomy 7:1–19 — The LORD set His love on you not because you were many, but because He loved you","nt":"Matthew 10:1–23 — Jesus sends the Twelve; do not fear those who kill the body","extra":"","talk":["Younger children: God did not choose His people because they were the biggest or best. Why did He choose them?","Older children: Deuteronomy 7 removes every reason for pride. How does that verse sit beside the tenants who thought they had earned the vineyard?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"October 9, 2026","theme":"Man Does Not Live by Bread Alone","ot":"Deuteronomy 8:1–20 — God humbled you and fed you with manna, that you might know what is in your heart","nt":"Matthew 10:24–42 — Whoever confesses Me before men, I also will confess before My Father","extra":"","talk":["Younger children: God gave manna every single morning for forty years. Why do you think He didn't give it all at once?","Older children: Deuteronomy says the wilderness was a test to reveal what was in their hearts. What has a hard season revealed about yours?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"October 10, 2026","theme":"Remember, Do Not Forget","ot":"Deuteronomy 9:1–22 — “Know that it is not because of your righteousness”; the golden calf recalled","nt":"Matthew 11:1–19 — Come to Me, all who labor and are heavy laden, and I will give you rest","extra":"","talk":["Younger children: While Moses was up the mountain with God, what did the people build? What do we make more important than God?","Older children: Deuteronomy 9 is a long list of Israel's failures — told to encourage them. How can remembering your sin be an encouragement?","Look ahead: Read part of tomorrow's Gospel, Matthew 22:1–14 (the wedding feast), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-10-04.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/909","yt_url":"https://www.youtube.com/results?search_query=LSB%20909%20Christ%20Is%20Made%20the%20Sure%20Foundation%20hymn"},"2026-10-11":{"key":"2026-10-11","ready":true,"range_label":"October 11–17, 2026","sunday_name":"The Twentieth Sunday after Pentecost (Proper 23)","sunday_date":"October 11, 2026","proper_label":"Proper 23, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"Come to the feast — and He provides the wedding garment too","sunday_readings":"Isaiah 25:6–9 · Psalm 23 · Philippians 4:4–13 · Matthew 22:1–14","next_sunday_label":"Proper 24","next_sunday_readings":"Isaiah 45:1–7 · Psalm 96:1–9 (10–13) · 1 Thessalonians 1:1–10 · Matthew 22:15–22","memory_ref":"1 Timothy 1:15","memory_text":"The saying is trustworthy and deserving of full acceptance, that Christ Jesus came into the world to save sinners, of whom I am the foremost.","hymn_title":"Soul, Adorn Yourself with Gladness","hymn_num":"LSB 636","hymn_full":"Soul, adorn yourself with gladness,\nLeave the gloomy haunts of sadness,\nCome into the daylight's splendor,\nThere with joy your praises render.\nBless the One whose grace unbounded\nThis amazing banquet founded;\nHe, though heav'nly, high, and holy,\nDeigns to dwell with you most lowly.\n\nJesus, source of lasting pleasure,\nTruest friend, and dearest treasure,\nPeace beyond all understanding,\nJoy into all life expanding:\nHumbly now, I bow before You,\nLove incarnate, I adore You;\nWorthily let me receive You\nAnd, so favored, never leave You.","learn_title":"Holy Baptism — What does such baptizing with water indicate?","learn_cite":"LSB p. 325","learn_quote":"It indicates that the Old Adam in us should by daily contrition and repentance be drowned and die with all sins and evil desires, and that a new man should daily emerge and arise to live before God in righteousness and purity forever.","introit_cite":"Isaiah 61:10; antiphon: Psalm 146:2","introit_lines":["<b>I will praise the LORD as long as I live;<\/b>","<b>I will sing praises to my God while I have my being.<\/b>","I will greatly rejoice in the LORD;","my soul shall exult in my God,","for he has clothed me with the garments of salvation;","he has covered me with the robe of righteousness,","as a bridegroom decks himself like a priest with a beautiful headdress,","and as a bride adorns herself with her jewels.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>I will praise the LORD as long as I live;<\/b>","<b>I will sing praises to my God while I have my being.<\/b>"],"introit_note":"","collect":"","gradual_cite":"Psalm 91:11; 103:1","gradual_lines":["For he will command his angels concerning you","to guard you in all your ways.","Bless the LORD, O my soul,","and all that is within me, bless his holy name!"],"week_at_home":"A king throws a wedding feast and the invited guests will not come — some are busy, some are hostile. So he sends his servants to the streets to bring in everyone they find, good and bad alike, until the hall is full. Isaiah promises this Sunday that God will spread a feast for all peoples and swallow up death forever. Notice that the one man without a wedding garment had no excuse: the host supplied them. Ask one another: “What keeps us from the feast — being too busy, or thinking we should dress ourselves?”","kids":{"title":"What is the “Sanctus”?","what":"The Sanctus (pronounced sahnk-TOOS) is a hymn of praise sung during Holy Communion. “Sanctus” is Latin for “holy.” It begins, “Holy, holy, holy Lord God of Sabaoth; heaven and earth are full of Your glory” — the very words the angels sing in Isaiah 6 — and then, “Blessed is He who comes in the name of the Lord,” the words the crowds sang on Palm Sunday.","why":"The Sanctus proclaims that Jesus comes to be with us in His body and blood for the forgiveness of sins. When we sing it, the angels in heaven and all who have died in the faith join us. This week's Gospel is about a wedding feast — and at the Sanctus you are standing right at the door of it.","parents":"Encourage your children to sing the Sanctus with the congregation. Remind them that Jesus is really here, and that they are singing with people and heavenly beings they cannot even see."},"days":[{"name":"Sunday","abbr":"Sun","date":"October 11, 2026","theme":"Come to the Feast — Everyone You Can Find","ot":"Deuteronomy 9:23—10:22 — “What does the LORD require of you?” — circumcise your heart, love the sojourner","nt":"Matthew 11:20–30 — Come to Me, all who labor; woe to the cities that would not repent","extra":"Matthew 22:1–14 — the wedding feast and the wedding garment","talk":["Younger children: The king's friends were too busy to come to the party, so who got invited instead? Would you have gone?","Older children: The man without a garment is speechless because the host provided them. What is the garment, and where do you receive it?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"October 12, 2026","theme":"Love the LORD Your God and Serve Him","ot":"Deuteronomy 11:1–25 — Remember the great things your own eyes have seen; keep the whole commandment","nt":"Matthew 12:1–21 — The Son of Man is lord of the Sabbath; a bruised reed He will not break","extra":"","talk":["Younger children: “A bruised reed He will not break.” If you feel bent and tired, how does Jesus treat you?","Older children: Deuteronomy repeatedly says “your own eyes have seen.” Why does God keep appealing to memory rather than argument?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"October 13, 2026","theme":"A Blessing and a Curse Set Before You","ot":"Deuteronomy 11:26—12:12 — “See, I set before you today a blessing and a curse”","nt":"Matthew 12:22–37 — A house divided cannot stand; the tree is known by its fruit","extra":"","talk":["Younger children: God set two paths in front of His people. Which one did He want them to choose?","Older children: Jesus says a tree is known by its fruit. How is that a warning against pretending to have chosen the blessing?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"October 14, 2026","theme":"Whoever Does the Will of My Father","ot":"Deuteronomy 12:13–32 — Worship God the way He commands, not each doing what is right in his own eyes","nt":"Matthew 12:38–50 — “Whoever does the will of My Father in heaven is My brother and sister and mother”","extra":"","talk":["Younger children: Jesus says people who trust Him are His family. Who is in your church family?","Older children: Deuteronomy warns against inventing worship; Jesus redefines family around obedience to the Father. How are those the same instinct?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"October 15, 2026","theme":"A Sower Went Out to Sow","ot":"Deuteronomy 13:1–18 — Do not follow other voices, however impressive their signs","nt":"Matthew 13:1–23 — The parable of the sower and the four soils","extra":"","talk":["Younger children: We heard this story back in July. What happens to seed that falls on the path? On good soil?","Older children: Deuteronomy 13 warns about persuasive false prophets; the parable warns about shallow soil. Which danger is closer to home for you?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"October 16, 2026","theme":"Open Your Hand to Your Brother","ot":"Deuteronomy 14:1–2, 22–23, 14:28—15:15 — Give generously to the poor and do not harden your heart; release debts in the seventh year","nt":"Matthew 13:24–43 — The weeds among the wheat, explained","extra":"","talk":["Younger children: God told His people to open their hands and not hold tight. What could you open your hand and give away?","Older children: God built debt-cancellation into Israel's calendar. How does that shape the way you think about what you are owed?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"October 17, 2026","theme":"Treasure in a Field, a Pearl of Great Price","ot":"Deuteronomy 15:19—16:22 — The appointed feasts: “You shall rejoice before the LORD your God”","nt":"Matthew 13:44–58 — The kingdom is like treasure hidden in a field, and like one priceless pearl","extra":"","talk":["Younger children: The man sold everything he had to buy one field. What made it worth that much?","Older children: Israel's calendar was built around feasts of rejoicing. How does that connect the treasure, the pearl, and tomorrow's wedding banquet?","Look ahead: Read part of tomorrow's Gospel, Matthew 22:15–22 (render to Caesar), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-10-11.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/636","yt_url":"https://www.youtube.com/results?search_query=LSB%20636%20Soul%2C%20Adorn%20Yourself%20with%20Gladness%20hymn"},"2026-10-18":{"key":"2026-10-18","ready":true,"range_label":"October 18–24, 2026","sunday_name":"The Twenty-first Sunday after Pentecost (Proper 24)","sunday_date":"October 18, 2026","proper_label":"Proper 24, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"Give to Caesar what is Caesar's — and to God what bears His image","sunday_readings":"Isaiah 45:1–7 · Psalm 96:1–9 (10–13) · 1 Thessalonians 1:1–10 · Matthew 22:15–22","next_sunday_label":"Reformation (Observed)","next_sunday_readings":"Revelation 14:6–7 · Psalm 46 · Romans 3:19–28 · Matthew 11:12–19 or John 8:31–36","memory_ref":"John 8:31–32","memory_text":"So Jesus said to the Jews who had believed Him, “If you abide in My word, you are truly My disciples, and you will know the truth, and the truth will set you free.”","hymn_title":"Before You, Lord, We Bow","hymn_num":"LSB 966","hymn_full":"Before You, Lord, we bow,\nOur God who reigns above\nAnd rules the world below,\nBoundless in pow'r and love.\nOur thanks we bring\nIn joy and praise,\nOur hearts we raise\nTo You, our King!\n\nMay ev'ry mountain height,\nEach vale and forest green,\nShine in Your Word's pure light,\nAnd its rich fruits be seen!\nMay ev'ry tongue\nBe tuned to praise\nAnd join to raise\nA grateful song.","learn_title":"The Second Commandment","learn_cite":"LSB p. 321","learn_quote":"You shall not misuse the name of the Lord your God. What does this mean? We should fear and love God so that we do not curse, swear, use satanic arts, lie, or deceive by His name, but call upon it in every trouble, pray, praise, and give thanks.","introit_cite":"Psalm 121:1–4, 7–8; antiphon: v. 5","introit_lines":["<b>The LORD is your keeper;<\/b>","<b>the LORD is your shade on your right hand.<\/b>","I lift up my eyes to the hills.","From where does my help come?","My help comes from the LORD,","who made heaven and earth.","He will not let your foot be moved;","he who keeps you will not slumber.","Behold, he who keeps Israel","will neither slumber nor sleep.","The LORD will keep you from all evil;","he will keep your life.","The LORD will keep your going out and your coming in","from this time forth and forevermore.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>The LORD is your keeper;<\/b>","<b>the LORD is your shade on your right hand.<\/b>"],"introit_note":"","collect":"","gradual_cite":"Psalm 91:11; 103:1","gradual_lines":["For he will command his angels concerning you","to guard you in all your ways.","Bless the LORD, O my soul,","and all that is within me, bless his holy name!"],"week_at_home":"They try to trap Him with a coin. Jesus asks whose image is on it, and when they say Caesar's, He tells them to give Caesar back what already bears his likeness. The question He leaves hanging is the real one: whose image do you carry? Ask one another: “What belongs to God because it bears His likeness — and are we handing it over?”","kids":{"title":"What is the “Offering”?","what":"The Offering is the time in the service when we offer gifts to God along with the rest of the congregation. It is concluded with the Offertory, the song sung while the gifts are brought to the altar.","why":"Everything we have is already a gift from God. When we give an offering we are saying thank You — for life, food, family, and most of all our Savior. We give not because we must, but because in faith we want to. This Sunday Jesus holds up a coin and asks whose picture is on it. Ask whose picture is on you.","parents":"Before the service, remind your children what giving means. Help them think of all they have and how it is really God's gift. Encourage them to set aside some of their own money each week to give."},"days":[{"name":"Sunday","abbr":"Sun","date":"October 18, 2026","theme":"Whose Likeness Is This?","ot":"Deuteronomy 17:1–20 — Israel's king must write out a copy of the Law and read it all his days","nt":"Matthew 14:1–21 — John the Baptist is killed; Jesus feeds five thousand","extra":"Matthew 22:15–22 — render to Caesar the things that are Caesar's","talk":["Younger children: Jesus asked whose picture was on the coin. Whose picture — whose likeness — is on you?","Older children: Israel's king had to hand-copy the Law so he would not think he was above it. What does that say about power that answers to God?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"October 19, 2026","theme":"A Prophet Like Me","ot":"Deuteronomy 18:1–22 — “The LORD will raise up for you a prophet like me — it is to him you shall listen”","nt":"Matthew 14:22–36 — Jesus walks on the sea; those who touch His garment are made well","extra":"","talk":["Younger children: Moses promised God would send another prophet like him. Who was he talking about?","Older children: On the mountain this Saturday, the Father will say of Jesus, “Listen to Him.” How is that Deuteronomy 18 being fulfilled out loud?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"October 20, 2026","theme":"What Really Makes a Person Unclean","ot":"Deuteronomy 19:1–20 — Cities of refuge; two or three witnesses required","nt":"Matthew 15:1–20 — Not what goes into the mouth defiles, but what comes out of the heart","extra":"","talk":["Younger children: Jesus says the bad things come out of our hearts, not off our hands. Who can make a heart clean?","Older children: The Pharisees kept careful rules about hands. What are the modern equivalents — the clean-looking habits that leave the heart untouched?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"October 21, 2026","theme":"Great Is Your Faith","ot":"Deuteronomy 20:1–20 — Laws for war; even a besieged city's trees are to be spared","nt":"Matthew 15:21–39 — The Canaanite woman will not be put off; four thousand are fed","extra":"","talk":["Younger children: The woman kept asking Jesus even when it seemed like He said no. What did Jesus finally say about her faith?","Older children: She takes Jesus' own words and turns them into a plea for crumbs. What does that teach about praying with Scripture?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"October 22, 2026","theme":"Cursed Is Everyone Hanged on a Tree","ot":"Deuteronomy 21:1–23 — A body hung on a tree is under God's curse and must not remain overnight","nt":"Matthew 16:1–12 — Beware the leaven of the Pharisees and Sadducees","extra":"","talk":["Younger children: Today's Old Testament reading says something surprising about anyone hung on a tree. Where did Jesus die?","Older children: Paul quotes this verse in Galatians 3:13 — “Christ redeemed us from the curse of the law by becoming a curse for us.” Read them side by side."],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"October 23, 2026","theme":"You Are the Christ, the Son of the Living God","ot":"Deuteronomy 24:10—25:10 — Justice, honest weights, and care for the vulnerable","nt":"Matthew 16:13–28 — Peter's confession; take up your cross and follow Me","extra":"","talk":["Younger children: Jesus asked, “Who do you say that I am?” How would you answer Him?","Older children: Peter gets the confession exactly right and the cross exactly wrong within six verses. What does that say about knowing the right words?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"October 24, 2026","theme":"His Face Shone Like the Sun","ot":"Deuteronomy 25:17—26:19 — Bring the firstfruits and say, “A wandering Aramean was my father”","nt":"Matthew 17:1–13 — The Transfiguration: “This is My beloved Son; listen to Him”","extra":"","talk":["Younger children: Peter, James, and John saw Jesus shining. What did the voice from the cloud tell them to do?","Older children: Israel brought firstfruits while reciting their rescue story. How does the Transfiguration function the same way — a glimpse given before the hard road?","Look ahead: Next Sunday is Reformation Day. Read John 8:31–36, and ask what it means to be “free indeed.”"],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-10-18.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/966","yt_url":"https://www.youtube.com/results?search_query=LSB%20966%20Before%20You%2C%20Lord%2C%20We%20Bow%20hymn"},"2026-10-25":{"key":"2026-10-25","ready":true,"range_label":"October 25–31, 2026","sunday_name":"Reformation Day (Observed)","sunday_date":"October 25, 2026","proper_label":"Reformation, Series A","season":"Reformation","color":"Red","season_bg":"#9e1b1b","season_fg":"#ffffff","rule":"#9e1b1b","week_theme":"If the Son sets you free, you will be free indeed","sunday_readings":"Revelation 14:6–7 · Psalm 46 · Romans 3:19–28 · Matthew 11:12–19 or John 8:31–36","next_sunday_label":"All Saints' Day (Observed)","next_sunday_readings":"Revelation 7:(2–8) 9–17 · Psalm 149 · 1 John 3:1–3 · Matthew 5:1–12","memory_ref":"Ephesians 2:8–9","memory_text":"For by grace you have been saved through faith. And this is not your own doing; it is the gift of God, not a result of works, so that no one may boast.","hymn_title":"A Mighty Fortress Is Our God","hymn_num":"LSB 656","hymn_full":"A mighty fortress is our God,\nA sword and shield victorious;\nHe breaks the cruel oppressor's rod\nAnd wins salvation glorious.\nThe old satanic foe\nHas sworn to work us woe.\nWith craft and dreadful might\nHe arms himself to fight.\nOn earth he has no equal.\n\nThe Word they still shall let remain\nNor any thanks have for it;\nHe's by our side upon the plain\nWith His good gifts and Spirit.\nAnd take they our life,\nGoods, fame, child, and wife,\nThough these all be gone,\nOur vict'ry has been won;\nThe Kingdom ours remaineth.","learn_title":"The Third Commandment","learn_cite":"LSB p. 321","learn_quote":"Remember the Sabbath day by keeping it holy. What does this mean? We should fear and love God so that we do not despise preaching and His Word, but hold it sacred and gladly hear and learn it.","introit_cite":"Psalm 34:1–2, 11, 22; antiphon: Psalm 119:46","introit_lines":["<b>I will speak of your testimonies before kings, O LORD,<\/b>","<b>and shall not be put to shame.<\/b>","I will bless the LORD at all times;","his praise shall continually be in my mouth.","My soul makes its boast in the LORD;","let the humble hear and be glad.","Come, O children, listen to me;","I will teach you the fear of the LORD.","The LORD redeems the life of his servants;","none of those who take refuge in him will be condemned.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>I will speak of your testimonies before kings, O LORD,<\/b>","<b>and shall not be put to shame.<\/b>"],"introit_note":"","collect":"Almighty and gracious Lord, pour out Your Holy Spirit on Your faithful people. Keep us steadfast in Your grace and truth, protect and deliver us in times of temptation, defend us against all enemies, and grant to Your Church Your saving peace; through Jesus Christ, Your Son, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Psalm 48:1, 12–14","gradual_lines":["Great is the LORD and greatly to be praised","in the city of our God!","Walk about Zion, go around her, number her towers,","consider well her ramparts, go through her citadels,","that you may tell the next generation","that this is God, our God forever and ever."],"week_at_home":"“If you abide in My word, you are truly My disciples, and you will know the truth, and the truth will set you free.” His hearers insisted they had never been slaves to anyone — untrue of them, and of us. Paul says it plainly this Sunday: all have sinned, and all are justified by His grace as a gift. Ask one another: “What are we still trying to earn from God that He has already given away?”","kids":{"title":"What is a “catechism”?","what":"A catechism (pronounced KAT-eh-kizm) is a book of instruction, usually written as questions and answers. The word comes from the Greek katekhein, “to instruct.” A catechism teaches the basics of the Christian faith.","why":"Visiting churches, Martin Luther found that many people did not know the Bible's true teaching. So he wrote the Small and Large Catechisms, so ordinary families could know Christ and His forgiveness. That is why your family has been learning a piece of the Small Catechism every week.","parents":"Luther wrote: “I, too, am a theologian… But I do not so glory in this gift as not to join my children daily in prayerfully reciting the Catechism… Without this practice our souls become rusty, as it were, and we lose ourselves.”"},"days":[{"name":"Sunday","abbr":"Sun","date":"October 25, 2026","theme":"Free Indeed","ot":"Deuteronomy 27:1–26 — The blessings and curses are read aloud from Mount Gerizim and Mount Ebal","nt":"Matthew 17:14–27 — “If you had faith like a grain of mustard seed…”","extra":"John 8:31–36 — the truth will set you free (or Matthew 11:12–19)","talk":["Younger children: Jesus says the truth makes us free. Free from what?","Older children: The crowd insisted they had never been enslaved to anyone. What kind of slavery were they missing — and what kind is easiest for us to miss?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"October 26, 2026","theme":"Blessings and Curses, Read Out Loud","ot":"Deuteronomy 28:1–22 — “If you faithfully obey… all these blessings shall come upon you and overtake you”","nt":"Matthew 18:1–20 — Become like children; if your brother sins, go and tell him his fault","extra":"","talk":["Younger children: God's people had to listen to a very long list of blessings and warnings. Why would God want them to hear both?","Older children: Deuteronomy 28 makes blessing conditional on perfect obedience. How does Romans 3:23–24 change the terms?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"October 27, 2026","theme":"The Secret Things Belong to the LORD","ot":"Deuteronomy 29:1–29 — “The secret things belong to the LORD our God, but the things revealed belong to us”","nt":"Matthew 18:21–35 — The unforgiving servant","extra":"","talk":["Younger children: There are things about God we do not get to know, and things He tells us clearly. Which kind is “Jesus loves you”?","Older children: Luther insisted we cling to the revealed God, not speculate about the hidden one. Why is that pastorally kind rather than restrictive?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"October 28, 2026","theme":"The Word Is Very Near You","ot":"Deuteronomy 30:1–20 — “The word is very near you, in your mouth and in your heart, so that you can do it”; choose life","nt":"Matthew 19:1–15 — Let the little children come to Me","extra":"","talk":["Younger children: God's Word is not far away up in the sky. Where does today's reading say it is?","Older children: Paul quotes this verse in Romans 10 and applies it to “the word of faith that we proclaim.” Read the two side by side."],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"October 29, 2026","theme":"What Must I Do? — The Wrong Question","ot":"Deuteronomy 31:1–29 — “Be strong and courageous… it is the LORD who goes before you”","nt":"Matthew 19:16–30 — The rich young man; with God all things are possible","extra":"","talk":["Younger children: A rich young man asked Jesus what good thing he had to do. Was there anything he could do to earn heaven?","Older children: The disciples ask, “Who then can be saved?” Jesus' answer is the Reformation's answer. What is it?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"October 30, 2026","theme":"The Song of Moses","ot":"Deuteronomy 31:30—32:27 — “The Rock, His work is perfect… a God of faithfulness and without iniquity”","nt":"Matthew 20:1–16 — The laborers in the vineyard: the last will be first","extra":"","talk":["Younger children: Moses calls God “the Rock.” What is good about standing on a rock?","Older children: Moses teaches Israel a song so they will remember when he is gone. Why do we still learn hymns by heart?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"October 31, 2026","theme":"Reformation Day — Here I Stand","ot":"Deuteronomy 32:28–52 — “Take to heart all the words… it is no empty word for you, but your very life”","nt":"Matthew 20:17–34 — The Son of Man came not to be served but to give His life as a ransom for many","extra":"","talk":["Younger children: On this day in 1517, Martin Luther nailed a paper to a church door asking questions about how people are saved. What is the answer?","Older children: Matthew 20:28 — a ransom for many. How does that one word, ransom, undo the idea that we buy God's favor?","Look ahead: Tomorrow the Church remembers all the saints. Read Revelation 7:9–17 and Matthew 5:1–12."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-10-25.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/656","yt_url":"https://www.youtube.com/results?search_query=LSB%20656%20A%20Mighty%20Fortress%20Is%20Our%20God%20hymn"},"2026-11-01":{"key":"2026-11-01","ready":true,"range_label":"November 1–7, 2026","sunday_name":"All Saints' Day","sunday_date":"November 1, 2026","proper_label":"All Saints, Series A","season":"All Saints","color":"White","season_bg":"#f3efe2","season_fg":"#2b2620","rule":"#b08d3f","week_theme":"A great multitude that no one could number — and you are counted among them","sunday_readings":"Revelation 7:(2–8) 9–17 · Psalm 149 · 1 John 3:1–3 · Matthew 5:1–12","next_sunday_label":"Proper 27","next_sunday_readings":"Amos 5:18–24 · Psalm 70 · 1 Thessalonians 4:13–18 · Matthew 25:1–13","memory_ref":"Revelation 21:4","memory_text":"He will wipe away every tear from their eyes, and death shall be no more, neither shall there be mourning, nor crying, nor pain anymore, for the former things have passed away.","hymn_title":"For All the Saints","hymn_num":"LSB 677","hymn_full":"For all the saints who from their labors rest,\nWho Thee by faith before the world confessed,\nThy name, O Jesus, be forever blest.\nAlleluia! Alleluia!\n\nThou wast their rock, their fortress, and their might;\nThou, Lord, their captain in the well-fought fight;\nThou, in the darkness drear, their one true light.\nAlleluia! Alleluia!\n\nAnd when the fight is fierce, the warfare long,\nSteals on the ear the distant triumph song,\nAnd hearts are brave again, and arms are strong.\nAlleluia! Alleluia!\n\nBut then there breaks a yet more glorious day:\nThe saints triumphant rise in bright array;\nThe King of Glory passes on His way.
