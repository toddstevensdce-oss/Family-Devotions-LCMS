<style>
  :root{
    --ink:#2b2620; --paper:#faf7f1; --card:#fff; --accent:#7a1f1f;
    --accent-soft:#f3e6e0; --gold:#b08d3f; --line:#e2dbce; --muted:#7c7466;
    --season-bg:#2f6b3a; --season-fg:#fff; --rule:#2f6b3a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Georgia,'Times New Roman',serif;background:var(--paper);color:var(--ink);line-height:1.55;}
  a{color:var(--accent);}
  header{background:var(--season-bg);color:var(--season-fg);text-align:center;
    padding:26px 16px 20px;border-bottom:4px solid var(--gold);transition:background .3s;}
  header h1{font-size:1.45rem;letter-spacing:.4px;}
  header .sub{font-style:italic;opacity:.92;font-size:.95rem;margin-top:4px;}
  header .theme{margin-top:10px;font-size:.9rem;background:rgba(127,127,127,.22);
    display:inline-block;padding:4px 14px;border-radius:20px;}
  header .season{margin-top:8px;font-size:.85rem;font-style:italic;opacity:.95;}
  .weeknav{background:var(--card);border-bottom:1px solid var(--line);padding:9px 12px;
    display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .weeknav select{font-family:inherit;font-size:.85rem;padding:6px 8px;max-width:min(70vw,420px);
    border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);}
  .weeknav button{font-family:inherit;font-size:.85rem;padding:6px 11px;cursor:pointer;
    border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);}
  .weeknav button:hover:not(:disabled){border-color:var(--gold);}
  .weeknav button:disabled{opacity:.35;cursor:default;}
  .weeknav .now{background:var(--accent);color:#fff;border-color:var(--accent);}
  nav.days{position:sticky;top:0;background:var(--card);border-bottom:2px solid var(--gold);
    display:flex;overflow-x:auto;z-index:5;}
  nav.days button{flex:1 0 auto;min-width:74px;padding:11px 8px;border:0;background:none;
    font-family:inherit;font-size:.85rem;cursor:pointer;color:var(--muted);
    border-bottom:3px solid transparent;}
  nav.days button.active{color:var(--accent);font-weight:bold;border-bottom-color:var(--accent);}
  nav.days button .dot{color:var(--gold);}
  main{max-width:720px;margin:0 auto;padding:18px 16px 60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:18px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card h2{font-size:1.05rem;color:var(--accent);margin-bottom:8px;}
  .card h3{font-size:.8rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);margin:14px 0 4px;}
  .card h3:first-of-type{margin-top:0;}
  .datebar{font-size:.85rem;color:var(--muted);font-style:italic;margin-bottom:2px;}
  .verse{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 14px;
    border-radius:0 8px 8px 0;font-style:italic;margin:8px 0;}
  ul,ol{padding-left:20px;} li{margin:6px 0;}
  ol.order{padding-left:22px;margin:8px 0;} ol.order li{margin:8px 0;}
  .reassure{font-size:.9rem;font-style:italic;color:var(--muted);margin-top:10px;}
  .hymn{font-style:italic;white-space:pre-line;}
  .responsive-b{padding-left:1.4em;font-weight:bold;}
  .sc{font-size:.78em;letter-spacing:.04em;}
  .hymn-links{margin-top:8px;font-size:.85rem;}
  .hymn-links a{text-decoration:none;border-bottom:1px dotted var(--accent);}
  .hymn-links a:hover{border-bottom-style:solid;}
  .kids-card{border-left:5px solid var(--gold);}
  .kids-src{font-size:.72rem;color:var(--muted);margin-top:8px;}
  .notice{background:#fdf7e6;border:1px solid var(--gold);border-radius:8px;
    padding:12px 16px;margin:14px 0;font-size:.9rem;}
  .actions{margin-top:14px;font-size:.85rem;display:flex;gap:14px;flex-wrap:wrap;}
  .actions a,.actions button{font-family:inherit;font-size:.85rem;color:var(--accent);
    background:none;border:0;border-bottom:1px dotted var(--accent);cursor:pointer;
    padding:0;text-decoration:none;}
  details.all{margin-top:22px;font-size:.85rem;}
  details.all summary{cursor:pointer;color:var(--muted);}
  details.all ul{margin-top:8px;}
  .foot{font-size:.75rem;color:var(--muted);text-align:center;margin-top:28px;line-height:1.6;}
  @media print{
    .weeknav,nav.days,.actions,details.all{display:none!important;}
    header{background:#fff!important;color:var(--ink)!important;border-bottom:2px solid var(--ink);}
    .panel{display:block!important;page-break-after:always;}
    .card{box-shadow:none;}
  }
</style>

var WEEKS = {"2026-07-12":{"key":"2026-07-12","ready":true,"range_label":"July 12–18, 2026","sunday_name":"The Seventh Sunday after Pentecost (Proper 10)","sunday_date":"July 12, 2026","proper_label":"Proper 10, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"The Sower sows His Word — and it does not return empty","sunday_readings":"Isaiah 55:10–13 · Psalm 65:(1–8) 9–13 · Romans 8:12–17 · Matthew 13:1–9, 18–23","next_sunday_label":"Proper 11","next_sunday_readings":"Isaiah 44:6–8 · Psalm 119:57–64 · Romans 8:18–27 · Matthew 13:24–30, 36–43","memory_ref":"Hebrews 1:1–2","memory_text":"Long ago, at many times and in many ways, God spoke to our fathers by the prophets, but in these last days He has spoken to us by His Son, whom He appointed the heir of all things, through whom also He created the world.","hymn_title":"Almighty God, Your Word Is Cast","hymn_num":"LSB 577","hymn_full":"Almighty God, Your Word is cast\nLike seed into the ground;\nNow let the dew of heav'n descend\nAnd righteous fruits abound.\n\nLet not the sly satanic foe\nThis holy seed remove,\nBut give it root in ev'ry heart\nTo bring forth fruits of love.\n\nLet not the world's deceitful cares\nThe rising plant destroy,\nBut let it yield a hundredfold\nThe fruits of peace and joy.\n\nSo when the precious seed is sown,\nLife-giving grace bestow,\nThat all whose souls the truth receive\nIts saving pow'r may know.","learn_title":"The Third Article of the Creed","learn_cite":"LSB p. 323","learn_quote":"I believe that I cannot by my own reason or strength believe in Jesus Christ, my Lord, or come to Him; but the Holy Spirit has called me by the Gospel, enlightened me with His gifts, sanctified and kept me in the true faith…","introit_cite":"Psalm 103:15–19; antiphon: v. 8","introit_lines":["<b>The LORD is merciful and gracious,<\/b>","<b>slow to anger and abounding in steadfast love.<\/b>","As for man, his days are like grass;","he flourishes like a flower of the field;","for the wind passes over it, and it is gone,","and its place knows it no more.","But the steadfast love of the LORD is from everlasting to everlasting on those who fear him,","and his righteousness to children's children,","to those who keep his covenant","and remember to do his commandments.","The LORD has established his throne in the heavens,","and his kingdom rules over all.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>The LORD is merciful and gracious,<\/b>","<b>slow to anger and abounding in steadfast love.<\/b>"],"introit_note":"","collect":"Blessed Lord, since You have caused all Holy Scriptures to be written for our learning, grant that we may so hear them, read, mark, learn, and inwardly digest them that we may embrace and ever hold fast the blessed hope of everlasting life; through Jesus Christ, Your Son, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Romans 11:33, 36","gradual_lines":["Oh, the depth of the riches and wisdom and knowledge of God!","How unsearchable are his judgments and how inscrutable his ways!","For from him and through him and to him are all things.","To him be glory forever. Amen."],"week_at_home":"In this Sunday's Gospel, Jesus tells of a sower whose seed falls on the path, on rocky ground, among thorns, and on good soil. The seed is the Word of God — and God is gloriously \"wasteful\" with it, scattering it everywhere, even on us! Through the week, watch the readings show that Word at work: in Gideon's 300, in Samson's weakness, in Hannah's prayer, and in Paul's letter to the Galatians. Ask one another: \"Where is God sowing His Word in our family — and what fruit is He growing?\"","kids":{"title":"What is the “Introit”?","what":"The Introit (pronounced in-TRO-it) comes from the Latin word introitus, which means “entrance.” The Introit used to be sung as the pastors came into the church and approached the altar.","why":"Usually the Introit is a Psalm, or parts of Psalms, put together to sketch a picture of the theme for the day. This week's Introit is from Psalm 103 — listen for it near the beginning of the service, and see if you can hear the theme of the day in it.","parents":"Before or after the Divine Service, look through the service folder for the Introit. Be sure to point out the one theme that ties all the parts of the service together: our Savior, Jesus Christ."},"days":[{"name":"Sunday","abbr":"Sun","date":"July 12, 2026","theme":"The Sower Sows His Word","ot":"Judges 7:1–23 — God gives Gideon victory with only 300 men","nt":"Galatians 1:1–24 — There is no other Gospel","extra":"Matthew 13:1–9, 18–23 — the Parable of the Sower","talk":["Younger children: In Jesus' story, what happened to the seed that fell on the good soil? How does God plant His Word in you?","Older children: Why did God shrink Gideon's army from 32,000 to 300? Where else does God use what looks small and weak (a manger, a cross, water, bread and wine) to do His mighty work?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"July 13, 2026","theme":"God Keeps His Promises — He Sends a Deliverer","ot":"Judges 13:1–25 — The birth of Samson is promised","nt":"Galatians 2:1–21 — Justified by faith in Christ, not by works of the law","extra":"","talk":["Younger children: God promised Samson's mom and dad a special baby who would start to rescue Israel. What rescue did God promise us — and who is our Rescuer?","Older children: Galatians 2:20 says, \"I have been crucified with Christ. It is no longer I who live, but Christ who lives in me.\" What does that mean for how you start this week?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"July 14, 2026","theme":"The Lord Gives Strength — Righteousness Comes by Faith","ot":"Judges 14:1–20 — Samson's riddle; the Spirit of the Lord gives strength","nt":"Galatians 3:1–22 — Abraham believed God, and it was counted to him as righteousness","extra":"","talk":["Younger children: Where did Samson's strength really come from? Who gives you everything you need each day?","Older children: Paul asks, \"Did you receive the Spirit by works of the law or by hearing with faith?\" (Gal. 3:2). How does that connect to Sunday's parable about hearing the Word?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"July 15, 2026","theme":"Abba! Father! — Children and Heirs of God","ot":"Judges 15:1–16:3 — God delivers Israel through Samson","nt":"Galatians 3:23–4:11 — In Baptism you have put on Christ; the Spirit cries, \"Abba! Father!\"","extra":"","talk":["Younger children: \"Abba\" is a child's word for \"Daddy.\" Why can we call God our Father?","Older children: Galatians 3:27 says all the baptized \"have put on Christ.\" How did Sunday's Epistle (Romans 8:12–17) say the same thing about being God's adopted children and heirs?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"July 16, 2026","theme":"God Hears and Answers — Even in Our Weakness","ot":"Judges 16:4–30 — Samson's fall and his final prayer; God answers","nt":"Galatians 4:12–31 — You are children of the promise","extra":"","talk":["Younger children: Samson made bad choices, but when he prayed, God still heard him. Will God still hear you when you mess up? (Yes! That's His promise.)","Older children: Samson's story ends in both failure and faith. Why is it good news that God's faithfulness doesn't depend on ours?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"July 17, 2026","theme":"The Lord Remembers Hannah — The Spirit Bears Fruit","ot":"1 Samuel 1:1–20 — Hannah prays in sorrow; the Lord remembers her","nt":"Galatians 5:1–26 — For freedom Christ has set us free; the fruit of the Spirit","extra":"","talk":["Younger children: Hannah was very sad, so she told God everything in prayer. What can you tell God about today?","Older children: Name the fruit of the Spirit (Gal. 5:22–23). How is this \"fruit\" the same fruit Jesus promised from seed sown on good soil (Matt. 13:23)?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"July 18, 2026","theme":"My Heart Rejoices in the Lord — Sowing and Reaping","ot":"1 Samuel 1:21–2:17 — Hannah keeps her promise and sings her song of praise","nt":"Galatians 6:1–18 — Whatever one sows, that will he also reap; do not grow weary of doing good","extra":"","talk":["Younger children: Hannah sang a thank-you song to God. What are three things your family can thank God for this week?","Older children: Galatians 6:7–9 returns to sowing and reaping — how has God's Word been \"sown\" in your family this week? Tomorrow is the Lord's Day: what will be sown then?","Look ahead: Read part of tomorrow's Gospel, Matthew 13:24–30, 36–43 (the wheat and the weeds), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-07-12.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/577","yt_url":"https://www.youtube.com/results?search_query=LSB%20577%20Almighty%20God%2C%20Your%20Word%20Is%20Cast%20hymn"},"2026-07-19":{"key":"2026-07-19","ready":true,"range_label":"July 19–25, 2026","sunday_name":"The Eighth Sunday after Pentecost (Proper 11)","sunday_date":"July 19, 2026","proper_label":"Proper 11, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"Wheat and weeds grow together — trust the Lord of the harvest","sunday_readings":"Isaiah 44:6–8 · Psalm 119:57–64 · Romans 8:18–27 · Matthew 13:24–30, 36–43","next_sunday_label":"Proper 12","next_sunday_readings":"Deuteronomy 7:6–9 · Psalm 125 · Romans 8:28–39 · Matthew 13:44–52","memory_ref":"1 John 4:18","memory_text":"There is no fear in love, but perfect love casts out fear.","hymn_title":"Come, Ye Thankful People, Come","hymn_num":"LSB 892","hymn_full":"Come, ye thankful people, come;\nRaise the song of harvest home.\nAll be safely gathered in\nEre the winter storms begin.\nGod, our maker, doth provide\nFor our wants to be supplied.\nCome to God's own temple, come;\nRaise the song of harvest home.\n\nAll the world is God's own field,\nFruit unto His praise to yield;\nWheat and tares together sown,\nUnto joy or sorrow grown;\nFirst the blade and then the ear,\nThen the full corn shall appear.\nLord of harvest, grant that we\nWholesome grain and pure may be.","learn_title":"The First Article of the Creed","learn_cite":"LSB p. 322","learn_quote":"I believe that God has made me and all creatures; that He has given me my body and soul, eyes, ears, and all my members, my reason and all my senses, and still takes care of them… All this He does only out of fatherly, divine goodness and mercy…","introit_cite":"Psalm 86:11–15; antiphon: v. 6","introit_lines":["<b>Give ear, O LORD, to my prayer;<\/b>","<b>listen to my plea for grace.<\/b>","Teach me your way, O LORD, that I may walk in your truth;","unite my heart to fear your name.","I give thanks to you, O Lord my God, with my whole heart,","and I will glorify your name forever.","For great is your steadfast love toward me;","you have delivered my soul from the depths of Sheol.","O God, insolent men have risen up against me; a band of ruthless men seek my life,","and they do not set you before them.","But you, O Lord, are a God merciful and gracious,","slow to anger and abounding in steadfast love and faithfulness.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>Give ear, O LORD, to my prayer;<\/b>","<b>listen to my plea for grace.<\/b>"],"introit_note":"","collect":"O God, so rule and govern our hearts and minds by Your Holy Spirit that, ever mindful of Your final judgment, we may be stirred up to holiness of living here and dwell with You in perfect joy hereafter; through Jesus Christ, Your Son, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Romans 11:33, 36","gradual_lines":["Oh, the depth of the riches and wisdom and knowledge of God!","How unsearchable are his judgments and how inscrutable his ways!","For from him and through him and to him are all things.","To him be glory forever. Amen."],"week_at_home":"In this Sunday's Gospel, an enemy sows weeds among the wheat — and the Master says, \"Let both grow together until the harvest.\" God is patient so that people may repent; the sorting belongs to Him, not us. Through the week, watch the readings show wheat and weeds side by side: faithful little Samuel next to Eli's wicked sons, the ark of God in Dagon's temple, and Paul preaching boldly among friends and enemies alike. Ask one another: \"Where do we need patience with people this week — and how has God been patient with us?\"","kids":{"title":"What is the “Collect”?","what":"The word “collect” (pronounced COLL-ect) comes from the Latin word collectus, which means “gathered together.” A Collect is a prayer to God which gathers together the thoughts of the congregation into one prayer for the day.","why":"We use the Collect because it focuses the congregation's prayers and attention on the readings from God's Word that follow. This Sunday, listen for the theme in the Collect — then listen for it again in the Gospel of the wheat and the weeds.","parents":"Before the Collect is prayed in the service, remind your children to pray in their minds along with the pastor and to listen for the same theme in the Collect and in the Gospel reading."},"days":[{"name":"Sunday","abbr":"Sun","date":"July 19, 2026","theme":"Wheat and Weeds Grow Together","ot":"1 Samuel 2:18–36 — The boy Samuel serves the LORD; Eli's sons despise Him","nt":"Acts 15:22–41 — The church sends a letter of encouragement","extra":"Matthew 13:24–30, 36–43 — the Parable of the Wheat and the Weeds","talk":["Younger children: In Jesus' story, why didn't the farmer let his workers pull up the weeds right away? (He was protecting the wheat!) Who is patient with you like that?","Older children: Faithful Samuel served right next to Eli's wicked sons — wheat and weeds side by side, even at God's house. Why does God wait to judge instead of striking evil down instantly? (See 2 Peter 3:9.)"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"July 20, 2026","theme":"Speak, LORD, Your Servant Hears","ot":"1 Samuel 3:1–21 — The LORD calls Samuel by name","nt":"Acts 16:1–22 — Timothy joins Paul; the Gospel crosses to Europe","extra":"","talk":["Younger children: What did Samuel learn to say when God called his name? How does God speak to us today? (In His Word!)","Older children: Timothy learned the faith from his mother and grandmother (Acts 16:1; 2 Timothy 1:5). Who planted the faith in you? Thank God for them by name."],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"July 21, 2026","theme":"God Is Not a Good-Luck Charm","ot":"1 Samuel 4:1–22 — Israel treats the ark like magic and loses it","nt":"Acts 16:23–40 — The jailer asks, \"What must I do to be saved?\"","extra":"","talk":["Younger children: The jailer asked, \"What must I do to be saved?\" What answer did Paul give him? (\"Believe in the Lord Jesus!\")","Older children: Israel carried the ark into battle like a lucky charm — and lost. What is the difference between trusting God and trying to use Him?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"July 22, 2026","theme":"Dagon Falls on His Face","ot":"1 Samuel 5:1–6:3, 10–16 — The idol Dagon falls before the ark of God","nt":"Acts 18:1–11, 23–28 — \"I have many in this city who are My people\"","extra":"","talk":["Younger children: What happened to the statue of Dagon when God's ark was put next to it? Can any idol stand up to our God?","Older children: Jesus told Paul, \"Do not be afraid… I have many in this city who are my people\" (Acts 18:9–10). How does that promise give courage in places where believing feels lonely?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"July 23, 2026","theme":"Ebenezer — \"Till Now the LORD Has Helped Us\"","ot":"1 Samuel 6:19–7:17 — Samuel sets up a stone of remembrance","nt":"Acts 19:1–22 — The Word of the Lord grows mightily in Ephesus","extra":"","talk":["Younger children: Samuel set up a stone to remember God's help. What could your family point to and say, \"God helped us here\"?","Older children: What \"Ebenezers\" — reminders of God's grace — has God given us? (Think of Baptism, the Lord's Supper, answered prayers.)"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"July 24, 2026","theme":"\"Give Us a King — Like All the Nations!\"","ot":"1 Samuel 8:1–22 — Israel rejects the LORD as King","nt":"Acts 21:15–36 — Paul goes to Jerusalem, ready to suffer","extra":"","talk":["Younger children: Israel wanted a king so they could be like everyone else. Is being like everyone else always a good thing?","Older children: Paul walked into Jerusalem knowing chains waited for him (Acts 21:13). What made him willing to go anyway?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"July 25, 2026","theme":"God Guides Little Things (Even Lost Donkeys)","ot":"1 Samuel 9:1–27 — Saul looks for donkeys; God is leading him all along","nt":"Acts 21:37–22:16 — \"Rise and be baptized and wash away your sins\"","extra":"","talk":["Younger children: Saul was just looking for lost donkeys, but God was leading the whole day. Can God use your ordinary day too?","Older children: Paul retells his story: \"Rise and be baptized and wash away your sins\" (Acts 22:16). What does your Baptism still do for you today?","Look ahead: Read part of tomorrow's Gospel, Matthew 13:44–46 (the hidden treasure and the pearl), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-07-19.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/892","yt_url":"https://www.youtube.com/results?search_query=LSB%20892%20Come%2C%20Ye%20Thankful%20People%2C%20Come%20hymn"},"2026-07-26":{"key":"2026-07-26","ready":true,"range_label":"July 26 – August 1, 2026","sunday_name":"The Ninth Sunday after Pentecost (Proper 12)","sunday_date":"July 26, 2026","proper_label":"Proper 12, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"The kingdom of heaven is a treasure — and you are His treasured possession","sunday_readings":"Deuteronomy 7:6–9 · Psalm 125 · Romans 8:28–39 · Matthew 13:44–52","next_sunday_label":"Proper 13","next_sunday_readings":"Isaiah 55:1–5 · Psalm 136:1–9 (23–26) · Romans 9:1–5 (6–13) · Matthew 14:13–21","memory_ref":"Ephesians 4:29","memory_text":"Let no corrupting talk come out of your mouths, but only such as is good for building up, as fits the occasion, that it may give grace to those who hear.","hymn_title":"Jesus, Priceless Treasure","hymn_num":"LSB 743","hymn_full":"Jesus, priceless treasure, / Fount of purest pleasure, / Truest friend to me. / Ah, how long in anguish / Shall my spirit languish, / Yearning, Lord, for Thee? / Thou art mine, O Lamb divine! / I will suffer naught to hide Thee; / Naught I ask beside Thee.","learn_title":"The Second Article of the Creed","learn_cite":"LSB p. 322","learn_quote":"…who has redeemed me, a lost and condemned person, purchased and won me from all sins, from death, and from the power of the devil… that I may be His own and live under Him in His kingdom…","introit_cite":"Psalm 105:2–6; antiphon: v. 1","introit_lines":["<b>Oh give thanks to the LORD; call upon his name;<\/b>","<b>make known his deeds among the peoples!<\/b>","Sing to him, sing praises to him;","tell of all his wondrous works!","Glory in his holy name;","let the hearts of those who seek the LORD rejoice!","Seek the LORD and his strength;","seek his presence continually!","Remember the wondrous works that he has done,","his miracles, and the judgments he uttered,","O offspring of Abraham, his servant,","children of Jacob, his chosen ones!","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>Oh give thanks to the LORD; call upon his name;<\/b>","<b>make known his deeds among the peoples!<\/b>"],"introit_note":"","collect":"Almighty and everlasting God, give us an increase of faith, hope, and love, that, receiving what You have promised, we may love what You have commanded; through Jesus Christ, Your Son, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Romans 11:33, 36","gradual_lines":["Oh, the depth of the riches and wisdom and knowledge of God!","How unsearchable are his judgments and how inscrutable his ways!","For from him and through him and to him are all things.","To him be glory forever. Amen."],"week_at_home":"In this Sunday's Gospel, a man finds treasure hidden in a field and, in his joy, sells everything to have it. The parable is first about Jesus: He gave everything — His own life — to make you His treasure. Deuteronomy 7 says God chose His people not because they were many or mighty, \"but because the LORD loves you.\" Through the week, watch God choose and use unlikely people: Saul the donkey-seeker, David the youngest brother, Paul the prisoner. Ask one another: \"If we are God's treasure, what does that make everything else we own?\"","kids":{"title":"What is the “Gradual”?","what":"The Gradual is the responsive reading between the Old Testament Reading and the Epistle. The word comes from the Latin gradus, meaning “step” — the Gradual is a stepping stone from one reading of God's Word to the next.","why":"After we hear God's Word in the Old Testament, we use God's Word in the Gradual to step to God's Word in the Epistle. There sure is a lot of God's wonderful Word in the Divine Service!","parents":"Before or after the Divine Service, show your children the Gradual for the day and remind them to concentrate on God's Word throughout the service."},"days":[{"name":"Sunday","abbr":"Sun","date":"July 26, 2026","theme":"The Treasure Hidden in the Field","ot":"1 Samuel 10:1–27 — Saul is anointed Israel's first king","nt":"Acts 22:17–29 — Paul, sent to the Gentiles","extra":"Matthew 13:44–52 — the Hidden Treasure, the Pearl, and the Net","talk":["Younger children: The man in Jesus' story sold everything with JOY to buy that field. What did Jesus give up to make you His treasure?","Older children: Deuteronomy 7:7–8 says God chose Israel not because they were great, \"but because the LORD loves you.\" How is that like the parable — and like your Baptism?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"July 27, 2026","theme":"The LORD Will Not Forsake His People","ot":"1 Samuel 12:1–25 — Samuel's farewell: \"Far be it from me to cease praying for you\"","nt":"Acts 22:30–23:11 — The Lord stands by Paul: \"Take courage\"","extra":"","talk":["Younger children: Samuel promised to keep praying for the people. Who prays for you? Who can you pray for tonight?","Older children: The night after a riot, the Lord stood by Paul and said, \"Take courage\" (Acts 23:11). When have you needed those exact words?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"July 28, 2026","theme":"Waiting Is Hard","ot":"1 Samuel 13:1–18 — Saul can't wait and disobeys","nt":"Acts 23:12–35 — God quietly foils a murder plot","extra":"","talk":["Younger children: Saul got scared and couldn't wait for Samuel. Why is waiting for God so hard sometimes?","Older children: God saved Paul's life through a nephew who happened to overhear a plot (Acts 23:16). Where might God be working through ordinary details around you?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"July 29, 2026","theme":"Obedience, Not Excuses","ot":"1 Samuel 14:47–15:9 — Saul obeys only partly","nt":"Acts 24:1–23 — Paul keeps a clear conscience","extra":"","talk":["Younger children: Saul obeyed God only part-way. Is \"mostly obeying\" really obeying?","Older children: Paul aimed to keep \"a clear conscience toward both God and man\" (Acts 24:16). What keeps a conscience clear? (Hint: confession — and Christ's forgiveness.)"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"July 30, 2026","theme":"To Obey Is Better Than Sacrifice","ot":"1 Samuel 15:10–35 — The LORD rejects Saul as king","nt":"Acts 24:24–25:12 — Felix trembles but says \"later\"","extra":"","talk":["Younger children: Which makes God happier — big presents, or listening to Him? (1 Samuel 15:22)","Older children: Felix heard Paul, was alarmed, and said \"Go away for the present\" (Acts 24:25). What is the danger of putting God off until later?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"July 31, 2026","theme":"The LORD Looks at the Heart","ot":"1 Samuel 16:1–23 — David, the youngest, is anointed","nt":"Acts 25:13–27 — Paul's case goes before a king","extra":"","talk":["Younger children: People look at the outside of a person. What does God look at? (1 Samuel 16:7)","Older children: God chose the youngest brother nobody thought to invite — like treasure hidden in a field. Where else in the Bible does God choose the unlikely?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"August 1, 2026","theme":"Giants Ahead — but God Is Bigger","ot":"1 Samuel 17:1–19 — Goliath defies the armies of the living God","nt":"Acts 26:1–23 — Paul tells his story to King Agrippa","extra":"","talk":["Younger children: Goliath was huge and scary. Who fights for God's people — then and now?","Older children: Paul could tell the story of his faith in a few minutes, to a king. Practice telling yours in one minute — what would you say?","Look ahead: Read part of tomorrow's Gospel, Matthew 14:13–21 (the feeding of the five thousand), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-07-26.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/743","yt_url":"https://www.youtube.com/results?search_query=LSB%20743%20Jesus%2C%20Priceless%20Treasure%20hymn"},"2026-08-02":{"key":"2026-08-02","ready":true,"range_label":"August 2 – 8, 2026","sunday_name":"The Tenth Sunday after Pentecost (Proper 13)","sunday_date":"August 2, 2026","proper_label":"Proper 13, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"Not enough in our hands — more than enough in His","sunday_readings":"Isaiah 55:1–5 · Psalm 136:1–9 (23–26) · Romans 9:1–5 (6–13) · Matthew 14:13–21","next_sunday_label":"Proper 14","next_sunday_readings":"Job 38:4–18 · Psalm 18:1–6 (7–16) · Romans 10:5–17 · Matthew 14:22–33","memory_ref":"Ephesians 4:32","memory_text":"Be kind to one another, tenderhearted, forgiving one another, as God in Christ forgave you.","hymn_title":"O Living Bread from Heaven","hymn_num":"LSB 642","hymn_full":"O living Bread from heaven, / How well You feed Your guest! / The gifts that You have given / Have filled my heart with rest. / Oh, wondrous food of blessing, / Oh, cup that heals our woes, / My heart, this gift possessing, / With praises overflows.","learn_title":"The Fourth Petition of the Lord's Prayer","learn_cite":"LSB p. 323","learn_quote":"Give us this day our daily bread. What does this mean? God certainly gives daily bread to everyone without our prayers, even to all evil people, but we pray in this petition that God would lead us to realize this and to receive our daily bread with thanksgiving.","introit_cite":"Psalm 105:39–43; antiphon: v. 1","introit_lines":["<b>Oh give thanks to the LORD; call upon his name;<\/b>","<b>make known his deeds among the peoples!<\/b>","He spread a cloud for a covering,","and fire to give light by night.","They asked, and he brought quail,","and gave them bread from heaven in abundance.","He opened the rock, and water gushed out;","it flowed through the desert like a river.","For he remembered his holy promise,","and Abraham, his servant.","So he brought his people out with joy,","his chosen ones with singing.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>Oh give thanks to the LORD; call upon his name;<\/b>","<b>make known his deeds among the peoples!<\/b>"],"introit_note":"","collect":"Heavenly Father, though we do not deserve Your goodness, still You provide for all our needs of body and soul. Grant us Your Holy Spirit that we may acknowledge Your gifts, give thanks for all Your benefits, and serve You in willing obedience; through Jesus Christ, Your Son, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Romans 11:33, 36","gradual_lines":["Oh, the depth of the riches and wisdom and knowledge of God!","How unsearchable are his judgments and how inscrutable his ways!","For from him and through him and to him are all things.","To him be glory forever. Amen."],"week_at_home":"In this Sunday's Gospel more than five thousand hungry people sit down on the grass, and all the disciples can find is five loaves and two fish. Jesus takes the little that is there, gives thanks, breaks it, and hands it back — and everyone eats until they are full, with twelve baskets left over. Isaiah 55 calls the thirsty to come and buy \"without money and without price.\" Watch that pattern all week: a shepherd boy with a sling, a prisoner breaking bread in a shipwreck. Ask one another: \"What has God put in our hands that He may want to bless, break, and give away?\"","kids":{"title":"What is the “Agnus Dei”?","what":"The Agnus Dei (pronounced AHN-yus DAY-ee) is Latin for “Lamb of God” — words the Church has sung for almost 1,200 years, right before we come to the Lord's Table.","why":"In John 1:29 John the Baptizer points at Jesus: “Behold, the Lamb of God, who takes away the sin of the world.” Singing the Agnus Dei, we confess the same thing — just as Christ gives us His body and blood for the forgiveness of sins.","parents":"After the service, read John 1:29–34 and compare it to the Passover lamb of Exodus 12:1–11."},"days":[{"name":"Sunday","abbr":"Sun","date":"August 2, 2026","theme":"You Give Them Something to Eat","ot":"1 Samuel 17:20–47 — David faces Goliath in the name of the LORD of hosts","nt":"Acts 26:24–27:8 — Paul appeals to Caesar and sets sail for Rome","extra":"Matthew 14:13–21 — Jesus feeds five thousand with five loaves and two fish","talk":["Younger children: Jesus started with five little loaves and two fish. How much was left over when everyone was full?","Older children: Jesus told the disciples, \"They need not go away; you give them something to eat\" (Matthew 14:16). Why would He ask them to do something they could not possibly do?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"August 3, 2026","theme":"The Battle Is the LORD's","ot":"1 Samuel 17:48–18:9 — Goliath falls; Saul begins to envy David","nt":"Acts 27:9–26 — A killing storm at sea: \"Take heart… I have faith in God\"","extra":"","talk":["Younger children: David ran straight at the giant. Who was really fighting for him?","Older children: Paul told terrified sailors, \"I have faith in God that it will be exactly as I have been told\" (Acts 27:25). Which promise of God can you take heart in this week?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"August 4, 2026","theme":"Bread in the Middle of a Shipwreck","ot":"1 Samuel 18:10–30 — Saul's jealousy hardens into fear and plotting","nt":"Acts 27:27–44 — Paul takes bread, gives thanks, and breaks it; all 276 reach land alive","extra":"","talk":["Younger children: Paul thanked God for bread while the ship was breaking apart. What can we thank God for today, even if today is hard?","Older children: Read Acts 27:35 next to Matthew 14:19. What does Paul do that Jesus did — and why would that steady a boatload of frightened people?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"August 5, 2026","theme":"A Friend Who Speaks Up for You","ot":"1 Samuel 19:1–24 — Jonathan speaks well of David; Michal helps him escape","nt":"Acts 28:1–15 — Unusual kindness on Malta; Paul \"thanked God and took courage\"","extra":"","talk":["Younger children: Jonathan told his father good things about David. Who could you say something kind about today?","Older children: Paul took courage simply because fellow Christians came out to meet him (Acts 28:15). How does God use other people to feed and strengthen us?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"August 6, 2026","theme":"A Promise That Doesn't Break","ot":"1 Samuel 20:1–23 — Jonathan and David make a covenant of steadfast love","nt":"Acts 28:16–31 — Paul proclaims the kingdom of God boldly and without hindrance","extra":"","talk":["Younger children: Jonathan promised to love David no matter what happened. Who has promised to love you no matter what?","Older children: In Isaiah 55:3 God promises \"an everlasting covenant, my steadfast, sure love for David.\" What makes God's promise stronger than any promise between friends?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"August 7, 2026","theme":"Come, Buy Without Money","ot":"1 Samuel 20:24–42 — Jonathan warns David; the friends part in tears","nt":"1 Corinthians 1:1–25 — The word of the cross is the power and wisdom of God","extra":"","talk":["Younger children: Isaiah says to come and eat \"without money.\" What does Jesus give us that we could never buy?","Older children: Paul says the cross looks like foolishness to the world (1 Corinthians 1:18–25). Where does God's way of doing things still look backward to people today?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"August 8, 2026","theme":"God Chooses What Is Weak","ot":"1 Samuel 24:1–22 — David spares Saul's life in the cave","nt":"1 Corinthians 1:26–2:16 — God chose what is weak to shame the strong","extra":"","talk":["Younger children: David had a chance to hurt Saul and didn't. Why is it so hard to be kind to someone who has been unkind to you?","Older children: \"God chose what is weak in the world to shame the strong\" (1 Corinthians 1:27). Five loaves, a shepherd boy, a cross — what is God's pattern?","Look ahead: Read part of tomorrow's Gospel, Matthew 14:22–33 (Jesus walks on the water), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-08-02.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/642","yt_url":"https://www.youtube.com/results?search_query=LSB%20642%20O%20Living%20Bread%20from%20Heaven%20hymn"},"2026-08-09":{"key":"2026-08-09","ready":true,"range_label":"August 9–15, 2026","sunday_name":"The Eleventh Sunday after Pentecost (Proper 14)","sunday_date":"August 9, 2026","proper_label":"Proper 14, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"Take heart; it is I — Christ comes to us across the storm","sunday_readings":"Job 38:4–18 · Psalm 18:1–6 (7–16) · Romans 10:5–17 · Matthew 14:22–33","next_sunday_label":"Proper 15","next_sunday_readings":"Isaiah 56:1, 6–8 · Psalm 67 · Romans 11:1–2a, 13–15, 28–32 · Matthew 15:21–28","memory_ref":"2 Thessalonians 2:16–17","memory_text":"Now may our Lord Jesus Christ Himself, and God our Father, who loved us and gave us eternal comfort and good hope through grace, comfort your hearts and establish them in every good work and word.","hymn_title":"Jesus, Savior, Pilot Me","hymn_num":"LSB 715","hymn_full":"Jesus, Savior, pilot me\nOver life's tempestuous sea;\nUnknown waves before me roll,\nHiding rock and treacherous shoal.\nChart and compass come from Thee:\nJesus, Savior, pilot me.\n\nAs a mother stills her child,\nThou canst hush the ocean wild;\nBoisterous waves obey Thy will\nWhen Thou say'st to them, “Be still!”\nWondrous Sov'reign of the sea,\nJesus, Savior, pilot me.\n\nWhen at last I near the shore\nAnd the fearful breakers roar\n'Twixt me and the peaceful rest,\nThen, while leaning on Thy breast,\nMay I hear Thee say to me,\n“Fear not, I will pilot thee.”","learn_title":"The Introduction to the Lord's Prayer","learn_cite":"LSB p. 323","learn_quote":"With these words God tenderly invites us to believe that He is our true Father and that we are His true children, so that with all boldness and confidence we may ask Him as dear children ask their dear father.","introit_cite":"Psalm 34:4–8; antiphon: v. 1","introit_lines":["<b>I will bless the LORD at all times;<\/b>","<b>his praise shall continually be in my mouth.<\/b>","I sought the LORD, and he answered me","and delivered me from all my fears.","Those who look to him are radiant,","and their faces shall never be ashamed.","This poor man cried, and the LORD heard him","and saved him out of all his troubles.","The angel of the LORD encamps around those who fear him,","and delivers them.","Oh, taste and see that the LORD is good!","Blessed is the man who takes refuge in him!","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>I will bless the LORD at all times;<\/b>","<b>his praise shall continually be in my mouth.<\/b>"],"introit_note":"","collect":"","gradual_cite":"Psalm 34:9, 19","gradual_lines":["Oh, fear the LORD, you his saints,","for those who fear him have no lack!","Many are the afflictions of the righteous,","but the LORD delivers him out of them all."],"week_at_home":"In this Sunday's Gospel the disciples are alone in a boat at night, fighting the wind, when Jesus comes to them walking on the water. Peter asks to come, walks, looks at the waves, and sinks — and the first thing he does right is cry out, “Lord, save me.” Jesus catches him immediately. Through the week the readings are full of people caught in storms of their own: David hunted by Saul, Abigail riding out to stop bloodshed, Saul groping in the dark for answers God had already offered him. Ask one another: “What storm are we in right now — and have we actually asked Jesus for help, out loud?”","kids":{"title":"What is “prayer”?","what":"Have you ever wanted to talk to God? You can! God promises to hear and answer us when we pray. Because we want to concentrate on what we are praying and who we are praying to, we may close our eyes, fold our hands, and bow our heads so we are not distracted. You don't have to do all that, though — you can pray anywhere, at any time.","why":"We not only ask God for what we need; we praise and thank Him for what He has already given. Much of our worship is prayer, including the Confession, the Agnus Dei, and the Post-Communion Canticle. This week's Gospel has one of the shortest prayers in the Bible — Peter, sinking, cries “Lord, save me!” and Jesus catches him at once.","parents":"Point out the different prayers in the service, such as the Prayer of the Church. Then turn to page 327 in Lutheran Service Book and read Luther's Morning and Evening Prayers; try using them at home when your children wake up and before they go to bed."},"days":[{"name":"Sunday","abbr":"Sun","date":"August 9, 2026","theme":"“Lord, Save Me!” — Jesus Comes Across the Water","ot":"1 Samuel 25:1–22 — Nabal insults David, and David sets out in anger","nt":"1 Corinthians 3:1–23 — No other foundation can be laid than Jesus Christ","extra":"Matthew 14:22–33 — Jesus walks on the sea and catches sinking Peter","talk":["Younger children: What did Peter say when he started to sink? Who reached out and grabbed him? How fast did Jesus do it?","Older children: Jesus says, “Take heart; it is I. Do not be afraid.” Where else in Scripture does God name Himself “I AM”? Paul says the only foundation is Christ (1 Cor. 3:11) — how is standing on water a picture of that?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"August 10, 2026","theme":"A Wise Woman Turns Away Wrath","ot":"1 Samuel 25:23–44 — Abigail rides out and stops David from taking revenge","nt":"1 Corinthians 4:1–21 — Servants of Christ and stewards of God's mysteries","extra":"","talk":["Younger children: Abigail hurried to make peace before anyone got hurt. Who could you go make peace with today?","Older children: David was minutes from bloodshed when Abigail stopped him. Paul writes, “When reviled, we bless” (1 Cor. 4:12). What does it cost to be the person who de-escalates?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"August 11, 2026","theme":"David Spares the Lord's Anointed — Again","ot":"1 Samuel 26:1–25 — David takes Saul's spear but will not harm him","nt":"1 Corinthians 5:1–13 — Cleanse out the old leaven; Christ our Passover Lamb","extra":"","talk":["Younger children: David had the chance to hurt Saul and chose not to. Why is it hard to be kind to someone who has been mean to you?","Older children: David says the LORD will repay each man for his righteousness. How does trusting God's justice set you free from having to get even?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"August 12, 2026","theme":"Where Do We Go for Answers?","ot":"1 Samuel 28:3–25 — Frightened Saul seeks a medium instead of the LORD","nt":"1 Corinthians 6:1–20 — You are not your own; you were bought with a price","extra":"","talk":["Younger children: Saul was scared, and instead of asking God he went looking for answers in the wrong place. Where should we go when we are afraid?","Older children: Saul sought guidance everywhere except from God, who had already spoken. Paul says your body is a temple of the Holy Spirit, bought with a price. How does belonging to Christ change where you look for help?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"August 13, 2026","theme":"The Sad End of a King Who Would Not Listen","ot":"1 Samuel 31:1–13 — The death of Saul and his sons on Mount Gilboa","nt":"1 Corinthians 7:1–24 — Let each lead the life the Lord has assigned to him","extra":"","talk":["Younger children: Saul's story ends sadly because he kept turning away from God's Word. What helps our family keep listening to God?","Older children: Paul says to live the life the Lord assigned you. Saul spent his reign grasping at a life God had not given him. Where are you tempted to do that?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"August 14, 2026","theme":"David Weeps for His Enemy","ot":"2 Samuel 1:1–27 — David laments Saul and Jonathan: “How the mighty have fallen!”","nt":"1 Corinthians 7:25–40 — Undivided devotion to the Lord","extra":"","talk":["Younger children: David was sad when Saul died, even though Saul had tried to hurt him. What does that tell you about David's heart?","Older children: God says He takes no pleasure in the death of the wicked (Ezek. 33:11). How is David's grief for an enemy a small picture of God's own heart — and of the cross?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"August 15, 2026","theme":"At Last, the Shepherd Becomes King","ot":"2 Samuel 5:1–25 — David is anointed king over all Israel and takes Jerusalem","nt":"1 Corinthians 8:1–13 — Knowledge puffs up, but love builds up","extra":"","talk":["Younger children: David waited years and years to become king. What is something you are waiting for? Who is waiting with you?","Older children: “Knowledge puffs up, but love builds up.” David finally has the power he was promised — what does he do with it, and what does that show about God's kind of king?","Look ahead: Read part of tomorrow's Gospel, Matthew 15:21–28 (the Canaanite woman's bold faith), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-08-09.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/715","yt_url":"https://www.youtube.com/results?search_query=LSB%20715%20Jesus%2C%20Savior%2C%20Pilot%20Me%20hymn"},"2026-08-16":{"key":"2026-08-16","ready":true,"range_label":"August 16–22, 2026","sunday_name":"The Twelfth Sunday after Pentecost (Proper 15)","sunday_date":"August 16, 2026","proper_label":"Proper 15, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"Great is your faith — mercy for all nations","sunday_readings":"Isaiah 56:1, 6–8 · Psalm 67 · Romans 11:1–2a, 13–15, 28–32 · Matthew 15:21–28","next_sunday_label":"Proper 16","next_sunday_readings":"Isaiah 51:1–6 · Psalm 138 · Romans 11:33–12:8 · Matthew 16:13–20","memory_ref":"Titus 3:4–6","memory_text":"When the goodness and loving kindness of God our Savior appeared, He saved us, not because of works done by us in righteousness, but according to His own mercy, by the washing of regeneration and renewal of the Holy Spirit, whom He poured out on us richly through Jesus Christ our Savior.","hymn_title":"In Christ There Is No East or West","hymn_num":"LSB 653","hymn_full":"In Christ there is no East or West, / In Him no South or North, / But one great fellowship of love / Throughout the whole wide earth.","learn_title":"The First Commandment","learn_cite":"LSB p. 321","learn_quote":"You shall have no other gods. What does this mean? We should fear, love, and trust in God above all things.","introit_cite":"Psalm 28:1–2, 6–7; antiphon: v. 8","introit_lines":["<b>The LORD is the strength of his people;<\/b>","<b>he is the saving refuge of his anointed.<\/b>","To you, O LORD, I call; my rock, be not deaf to me,","lest, if you be silent to me, I become like those who go down to the pit.","Hear the voice of my pleas for mercy, when I cry to you for help,","when I lift up my hands toward your most holy sanctuary.","Blessed be the LORD!","For he has heard the voice of my pleas for mercy.","The LORD is my strength and my shield; in him my heart trusts, and I am helped;","my heart exults, and with my song I give thanks to him.","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>The LORD is the strength of his people;<\/b>","<b>he is the saving refuge of his anointed.<\/b>"],"introit_note":"","collect":"Almighty God, whom to know is everlasting life, grant us to know Your Son, Jesus, to be the way, the truth, and the life, that we may steadfastly follow His steps in the way that leads to life eternal; through Jesus Christ, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Psalm 34:9, 19","gradual_lines":["Oh, fear the LORD, you his saints,","for those who fear him have no lack!","Many are the afflictions of the righteous,","but the LORD delivers him out of them all."],"week_at_home":"In this Sunday's Gospel, a Canaanite woman will not stop crying out to Jesus for mercy, and He commends her: \"Woman, great is your faith!\" Isaiah promises that God's house will be \"a house of prayer for all peoples,\" and Paul wrestles with how mercy reaches both Jew and Gentile. Through the week, watch David's house rise and then crack under his own sin, while Paul tells the Corinthians that even the strongest believer needs humility and love for the weak. Ask one another: \"Where do we need the Canaanite woman's bold, persistent faith this week?\"","kids":{"title":"What is the “Kyrie”?","what":"The Kyrie comes from the Greek words “kyrie eleison” (pronounced KEER-ee-ay eh-LAY-zon), which means “Lord, have mercy.” We sing it after we have confessed our sins and received God's forgiveness.","why":"When we sing the Kyrie, we are crying out for mercy so God would hear us and help us in every time of need. This week's Gospel gives us that very cry: the Canaanite woman calls out, “Lord, have mercy on me!” — the Kyrie in a single voice.","parents":"During worship, help your children recognize the Kyrie and its place in the service. Practice saying “Kyrie eleison” together, and praise them for learning a bit of Greek!"},"days":[{"name":"Sunday","abbr":"Sun","date":"August 16, 2026","theme":"Woman, Great Is Your Faith!","ot":"2 Samuel 6:1–19 — David dances before the LORD as the ark comes to Jerusalem","nt":"1 Corinthians 9:1–23 — Paul becomes all things to all people to win some for Christ","extra":"Matthew 15:21–28 — the Canaanite woman's persistent faith","talk":["Younger children: The woman in today's Gospel kept asking Jesus for help even when it seemed like He said no. What do you do when it feels like God isn't answering your prayer right away?","Older children: Jesus called the woman's faith \"great\" even though she wasn't part of Israel. What does that tell us about who belongs in God's family? (See Isaiah 56:6–8.)"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"August 17, 2026","theme":"A House That Will Never Fall","ot":"2 Samuel 7:1–17 — The LORD promises David an everlasting house and kingdom","nt":"1 Corinthians 9:24–10:22 — Run the race; flee from idolatry","extra":"","talk":["Younger children: God promised David a kingdom that would never end. Whose family really never ends? (Jesus, David's greater Son!)","Older children: Paul says to \"run so as to win\" and warns against idols we barely notice (1 Corinthians 9:24–27; 10:14). What competes for your devotion this week?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"August 18, 2026","theme":"Who Am I, O Lord GOD?","ot":"2 Samuel 7:18–29 — David's prayer of thanks for God's promise","nt":"1 Corinthians 10:23–11:16 — Do all to the glory of God","extra":"","talk":["Younger children: David asked, \"Who am I... that You have brought me thus far?\" What has God brought your family through?","Older children: Paul says, \"whatever you do, do all to the glory of God\" (1 Corinthians 10:31). How does that turn even ordinary tasks this week into worship?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"August 19, 2026","theme":"Even a King Falls — and Needs Grace","ot":"2 Samuel 11:1–27 — David sins with Bathsheba and against Uriah","nt":"1 Corinthians 11:17–34 — Examine yourselves before the Lord's Supper","extra":"","talk":["Younger children: David, even though he loved God, did something very wrong. What do we do when we sin? (Confess it and ask forgiveness!)","Older children: Paul says to \"examine yourselves\" before receiving the Supper (1 Corinthians 11:28). Why does honest confession — like David will soon need — belong with receiving Christ's gifts?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"August 20, 2026","theme":"\"You Are the Man\" — and Yet Forgiven","ot":"2 Samuel 12:1–25 — Nathan confronts David; David confesses and is forgiven","nt":"1 Corinthians 12:1–13 — One Spirit, many gifts, one body","extra":"","talk":["Younger children: Nathan told David a story to help him see his own sin. Who helps you see when you've done wrong?","Older children: David confesses, \"I have sinned against the LORD,\" and Nathan says, \"The LORD also has put away your sin\" (2 Samuel 12:13). How quickly does God's forgiveness come to those who confess?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"August 21, 2026","theme":"One Body With Many Parts","ot":"1 Kings 1:1–4, 15–35 — Solomon is anointed king in David's place","nt":"1 Corinthians 12:14–31 — Many members, one body","extra":"","talk":["Younger children: Paul says the body needs the eye AND the ear AND the hand. Who are the different people God has placed in your family or church?","Older children: Solomon becomes king only because others acted for him while he was weak. How does the body of Christ (1 Corinthians 12) care for members who can't help themselves right now?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"August 22, 2026","theme":"The Greatest of These Is Love","ot":"1 Kings 2:1–27 — David's charge to Solomon; the kingdom is established","nt":"1 Corinthians 13:1–13 — Love never ends","extra":"","talk":["Younger children: Without love, Paul says, even amazing things are \"nothing.\" What is one loving thing you can do for someone tomorrow?","Older children: Love \"bears all things, believes all things, hopes all things, endures all things\" (1 Corinthians 13:7). Which of those is hardest for you right now?","Look ahead: Read part of tomorrow's Gospel, Matthew 16:13–20 (Peter's confession, \"You are the Christ\"), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-08-16.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/653","yt_url":"https://www.youtube.com/results?search_query=LSB%20653%20In%20Christ%20There%20Is%20No%20East%20or%20West%20hymn"},"2026-08-23":{"key":"2026-08-23","ready":true,"range_label":"August 23–29, 2026","sunday_name":"The Thirteenth Sunday after Pentecost (Proper 16)","sunday_date":"August 23, 2026","proper_label":"Proper 16, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"You are the Christ — built on the Rock that cannot fall","sunday_readings":"Isaiah 51:1–6 · Psalm 138 · Romans 11:33–12:8 · Matthew 16:13–20","next_sunday_label":"Proper 17","next_sunday_readings":"Jeremiah 15:15–21 · Psalm 26 · Romans 12:9–21 · Matthew 16:21–28","memory_ref":"2 John 6","memory_text":"This is love, that we walk according to His commandments; this is the commandment, just as you have heard from the beginning, so that you should walk in it.","hymn_title":"Built on the Rock","hymn_num":"LSB 645","hymn_full":"Built on the Rock the Church shall stand, / Even when steeples are falling; / Crumbled have spires in every land; / Bells still are chiming and calling — / Calling the young and old to rest, / But above all the soul distrest, / Longing for rest everlasting.","learn_title":"The Office of the Keys","learn_cite":"LSB p. 326","learn_quote":"What is the Office of the Keys? It is that special authority which Christ has given to His church on earth to forgive the sins of repentant sinners, but to withhold forgiveness from the unrepentant as long as they do not repent.","introit_cite":"Psalm 2:6–7; 117; antiphon: Psalm 115:18","introit_lines":["<b>But we will bless the LORD from this time forth and forevermore.<\/b>","<b>Praise the LORD!<\/b>","As for me, I have set my King","on Zion, my holy hill.","I will tell of the decree: The LORD said to me,","\"You are my Son; today I have begotten you.\"","Praise the LORD, all nations!","Extol him, all peoples!","For great is his steadfast love toward us,","and the faithfulness of the LORD endures forever. Praise the LORD!","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>But we will bless the LORD from this time forth and forevermore.<\/b>","<b>Praise the LORD!<\/b>"],"introit_note":"","collect":"Almighty God, whom to know is everlasting life, grant us to know Your Son, Jesus, to be the way, the truth, and the life, that we may boldly confess Him to be the Christ and steadfastly walk in the way that leads to life eternal; through the same Jesus Christ, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Psalm 34:9, 19","gradual_lines":["Oh, fear the LORD, you his saints,","for those who fear him have no lack!","Many are the afflictions of the righteous,","but the LORD delivers him out of them all."],"week_at_home":"In this Sunday's Gospel, Jesus asks His disciples, \"Who do you say that I am?\" and Peter answers for the ages: \"You are the Christ, the Son of the living God.\" Jesus promises to build His Church on that confession — a Rock that not even the gates of hell can overcome. Through the week, watch Solomon build a house for the LORD's name and dedicate it with a prayer that God would hear and forgive, and then watch, tragically, as his own heart wanders after other gods — God's house stands even when ours falls. Ask one another: \"Who do we say Jesus is — and does our week show it?\"","kids":{"title":"Why Is Confession So Important?","what":"Confessing our sins is important! When we confess them, we see just how terribly sinful we are and admit that we deserve death and separation from God. We are free to admit all of this to Him because we know that Jesus has already died and paid for all of our sins.","why":"After Confession comes Absolution — the forgiveness of sins! \"If we confess our sins, he is faithful and just to forgive us our sins and to cleanse us from all unrighteousness\" (1 John 1:9). This Sunday Peter confesses, \"You are the Christ, the Son of the living God,\" and Jesus promises him and His Church the very keys that open heaven's forgiveness (Matthew 16:19).","parents":"Before the service, read through the confession and explain any words that might be confusing. During the service, help your children follow along with the Confession and Absolution, and remind them that when the Pastor speaks the Absolution, it is as if God Himself is speaking those words of comfort to us."},"days":[{"name":"Sunday","abbr":"Sun","date":"August 23, 2026","theme":"You Are the Christ, the Son of the Living God","ot":"1 Kings 3:1–15 — Solomon asks the LORD for a wise and understanding heart","nt":"2 Corinthians 1:1–22 — every promise of God is \"Yes\" in Christ","extra":"Matthew 16:13–20 — Peter confesses Jesus as the Christ; Jesus gives the keys of the kingdom","talk":["Younger children: Jesus asked His friends, \"Who do you say that I am?\" What is your answer? (He is the Christ, the Son of the living God!)","Older children: Jesus told Peter that flesh and blood didn't reveal this to him, but the Father in heaven did (Matt. 16:17). Whose work is it when you believe Jesus is the Christ — yours, or God's?"],"pray":"For the joy of the resurrection, and that the fruit of faith would grow in everyone who heard God's Word today."},{"name":"Monday","abbr":"Mon","date":"August 24, 2026","theme":"Solomon Gathers to Build the LORD a House","ot":"1 Kings 5:1–18 — Solomon gathers cedar and stone to build a house for the LORD's name","nt":"2 Corinthians 1:23–2:17 — believers are the aroma of Christ spreading everywhere","extra":"","talk":["Younger children: Solomon spent years gathering materials before the temple was even begun. What is your life built on? (Jesus, the Rock!)","Older children: Paul says we are \"the aroma of Christ\" to those around us (2 Corinthians 2:15). What would it look like for your life to carry that aroma this week?"],"pray":"For faith to live out our Baptism; for our callings and daily work; for schools, good government, and peace."},{"name":"Tuesday","abbr":"Tue","date":"August 25, 2026","theme":"The Ark Comes into the Finished Temple","ot":"1 Kings 7:51–8:21 — the temple is finished, and the ark of the covenant is brought in","nt":"2 Corinthians 3:1–18 — beholding the Lord's glory, we are transformed","extra":"","talk":["Younger children: God's glory filled Solomon's temple. Where does God still promise to be with us today? (In His Word, Baptism, and the Supper!)","Older children: Paul says we are being transformed \"from one degree of glory to another\" as we behold the Lord (2 Corinthians 3:18). How does that happen through ordinary weekly worship?"],"pray":"For deliverance from temptation and evil; for the addicted, the despairing, and all who struggle with sin."},{"name":"Wednesday","abbr":"Wed","date":"August 26, 2026","theme":"Solomon's Prayer: Hear from Heaven and Forgive","ot":"1 Kings 8:22–30, 46–63 — Solomon prays that the LORD would hear and forgive His people","nt":"2 Corinthians 4:1–18 — treasure in jars of clay; we do not lose heart","extra":"","talk":["Younger children: Solomon prayed that God would hear and forgive His people whenever they turned back to Him. Does God still hear and forgive us? (Yes — every time we confess!)","Older children: Paul says \"we have this treasure in jars of clay, to show that the surpassing power belongs to God and not to us\" (2 Corinthians 4:7). Where do you feel like a \"jar of clay\" this week — and how is that actually good news?"],"pray":"For marriage and family; for parents and children; for single parents; for our home, community, and schools."},{"name":"Thursday","abbr":"Thu","date":"August 27, 2026","theme":"The LORD Warns — and the Queen of Sheba Marvels","ot":"1 Kings 9:1–9; 10:1–13 — the LORD warns Solomon to stay faithful; the queen of Sheba marvels at his wisdom","nt":"2 Corinthians 5:1–21 — if anyone is in Christ, he is a new creation","extra":"","talk":["Younger children: The queen of Sheba traveled far to see Solomon's wisdom. Who is greater than Solomon, and how far did He travel to reach us? (Jesus, all the way from heaven!)","Older children: \"If anyone is in Christ, he is a new creation\" (2 Corinthians 5:17). What does that mean for how you see yourself, even on days you fail?"],"pray":"For the Church and her pastors; for teachers, deaconesses, and missionaries; with thanksgiving for the Sacrament."},{"name":"Friday","abbr":"Fri","date":"August 28, 2026","theme":"Even Solomon's Heart Turned Away","ot":"1 Kings 11:1–26 — Solomon's many wives turn his heart after other gods","nt":"2 Corinthians 6:1–18 — now is the day of salvation","extra":"","talk":["Younger children: The wisest king in the world still let his heart wander from God. Who keeps YOUR heart faithful? (The Holy Spirit, through His Word!)","Older children: Paul warns against being \"unequally yoked\" with what pulls us from Christ (2 Corinthians 6:14). What competes for Solomon-level devotion in your life?"],"pray":"For the preaching of the holy cross; for the persecuted and oppressed; for the sick and the dying."},{"name":"Saturday","abbr":"Sat","date":"August 29, 2026","theme":"The Kingdom Splits — but God's Promise Doesn't","ot":"1 Kings 11:42–12:19 — Solomon dies, and the kingdom of Israel splits in two","nt":"2 Corinthians 7:1–16 — godly grief produces repentance without regret","extra":"","talk":["Younger children: Israel's kingdom broke apart. What kingdom did Jesus promise would never break apart? (His Church, built on the Rock!)","Older children: Paul distinguishes \"godly grief\" that leads to repentance from worldly grief that leads to death (2 Corinthians 7:10). What's the difference between feeling bad about sin and truly repenting?","Look ahead: Read part of tomorrow's Gospel, Matthew 16:21–28 (Jesus foretells His death and calls us to take up our cross), to get ready for church."],"pray":"For faithfulness to the end; for those drifting from the faith; for hearts made ready to receive God's gifts on the Lord's Day."}],"pdf":"handouts/Family-Devotions-2026-08-23.pdf","hymnary_url":"https://hymnary.org/hymn/LSB2006/645","yt_url":"https://www.youtube.com/results?search_query=LSB%20645%20Built%20on%20the%20Rock%20hymn"},"2026-08-30":{"key":"2026-08-30","ready":false,"range_label":"2026-08-30","sunday_name":"The Fourteenth Sunday after Pentecost (Proper 17)","sunday_date":"August 30, 2026","proper_label":"Proper 17, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_theme":"","sunday_readings":"Jeremiah 15:15–21 · Psalm 26 · Romans 12:9–21 · Matthew 16:21–28","next_sunday_label":"Proper 18","next_sunday_readings":"Ezekiel 33:7–9 · Psalm 32:1–7 · Romans 13:1–10 · Matthew 18:1–20","memory_ref":"2 Samuel 7:22","memory_text":"You are great, O Lord God. For there is none like You, and there is no God besides You, according to all that we have heard with our ears.","hymn_title":"Come, Follow Me, the Savior Spake","hymn_num":"LSB 688","hymn_full":"“Come, follow Me,” the Savior spake, / All in My way abiding; / Deny yourselves, the world forsake, / Obey My call and guiding. / O bear the cross, whate’er betide, / Take My example for your guide.","learn_title":"What Does Such Baptizing with Water Indicate?","learn_cite":"LSB p. 325","learn_quote":"It indicates that the Old Adam in us should be drowned by daily contrition and repentance, and die with all sins and evil desires, and that a new man should daily emerge and arise to live before God in righteousness and purity forever.","introit_cite":"Psalm 37:5–7; antiphon: v. 4","introit_lines":["<b>Delight yourself in the LORD,<\/b>","<b>and he will give you the desires of your heart.<\/b>","Commit your way to the LORD;","trust in him, and he will act.","He will bring forth your righteousness as the light,","and your justice as the noonday.","Be still before the LORD and wait patiently for him;","fret not yourself over the one who prospers in his way, over the man who carries out evil devices!","Glory be to the Father and to the Son and to the Holy Spirit;","as it was in the beginning, is now, and will be forever. Amen.","<b>Delight yourself in the LORD,<\/b>","<b>and he will give you the desires of your heart.<\/b>"],"introit_note":"","collect":"Almighty God, Your Son willingly endured the agony and shame of the cross for our redemption. Grant us courage to take up our cross daily and follow Him wherever He leads; through the same Jesus Christ, our Lord, who lives and reigns with You and the Holy Spirit, one God, now and forever. Amen.","gradual_cite":"Psalm 34:9, 19, alt.","gradual_lines":["Fear the LORD, you his saints,","for those who fear him lack nothing!","Many are the afflictions of the righteous,","but the LORD delivers him out of them all."],"week_at_home":"","kids":null,"days":[],"pdf":"","hymnary_url":"https://hymnary.org/hymn/LSB2006/688","yt_url":"https://www.youtube.com/results?search_query=LSB%20688%20Come%2C%20Follow%20Me%2C%20the%20Savior%20Spake%20hymn"},"2026-09-06":{"key":"2026-09-06","ready":false,"range_label":"2026-09-06","sunday_name":"The Fifteenth Sunday after Pentecost (Proper 18)","sunday_date":"September 6, 2026","proper_label":"Proper 18, Series A","season":"Pentecost","color":"Green","season_bg":"#2f6b3a","season_fg":"#ffffff","rule":"#2f6b3a","week_t var SHOW_UPCOMING = true;
var KEYS = Object.keys(WEEKS).sort();

function keyDate(k){ var p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(dt, n){ return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()+n); }
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function visibleKeys(today){
  if (SHOW_UPCOMING) return KEYS.slice();
  var t = midnight(today).getTime();
  return KEYS.filter(function(k){ return keyDate(k).getTime() <= t; });
}

/* Which week covers `today`? Returns {key, status} where status is
   'current'  today falls inside that week
   'before'   the series hasn't started yet -> first week
   'after'    the series has ended -> last week                      */
function pickWeek(today){
  var t = midnight(today).getTime();
  var vis = visibleKeys(today);
  if (!vis.length) return {key: KEYS[0], status: 'before'};
  for (var i = 0; i < vis.length; i++){
    var s = keyDate(vis[i]).getTime();
    var e = addDays(keyDate(vis[i]), 6).getTime();
    if (t >= s && t <= e) return {key: vis[i], status: 'current'};
  }
  if (t < keyDate(vis[0]).getTime()) return {key: vis[0], status: 'before'};
  return {key: vis[vis.length-1], status: 'after'};
}

/* Which day tab should open by default? */
function pickDay(key, today){
  var t = midnight(today).getTime();
  var s = keyDate(key).getTime();
  var e = addDays(keyDate(key), 6).getTime();
  if (t < s || t > e) return 'overview';
  return ['sun','mon','tue','wed','thu','fri','sat'][today.getDay()];
}

if (typeof module !== 'undefined') { module.exports = {WEEKS:WEEKS, KEYS:KEYS, pickWeek:pickWeek, pickDay:pickDay, visibleKeys:visibleKeys}; }

<script>
/* ---- rendering ---- */
function esc(s){ var d = document.createElement('div'); d.textContent = (s == null ? '' : s); return d.innerHTML; }
function lord(s){ return String(s).replace(/LORD/g, 'L<span class="sc">ORD</span>'); }
function escL(s){ return lord(esc(s)); }

var state = { key: null, day: 'overview' };

function heading(w){
  document.documentElement.style.setProperty('--season-bg', w.season_bg);
  document.documentElement.style.setProperty('--season-fg', w.season_fg);
  document.documentElement.style.setProperty('--rule', w.rule);
  document.getElementById('range').textContent =
    'Week of ' + w.range_label + (w.sunday_name ? ' · ' + w.sunday_name : '');
  document.getElementById('theme').textContent = w.week_theme ? 'This week: ' + w.week_theme : '';
  document.getElementById('theme').style.display = w.week_theme ? '' : 'none';
  document.getElementById('season').textContent =
    w.season ? 'Season of ' + w.season + ' ✠ Liturgical Color: ' + w.color : '';
}

function propersCard(w){
  var h = '<div class="card"><h2>Sunday’s Propers' + (w.proper_label ? ' — ' + esc(w.proper_label) : '') + '</h2>';
  h += '<h3>Readings</h3><p>' + esc(w.sunday_readings) + '</p>';
  if (w.introit_lines.length){
    h += '<h3>Introit — ' + esc(w.introit_cite) + '</h3>';
    for (var i = 0; i < w.introit_lines.length; i++){
      h += '<p' + (i % 2 ? ' class="responsive-b"' : '') + '>' + lord(w.introit_lines[i]) + '</p>';
    }
  } else if (w.introit_note){
    h += '<h3>Introit</h3><p><em>' + esc(w.introit_note) + '</em></p>';
  }
  if (w.collect) h += '<h3>Collect of the Day</h3><p>' + esc(w.collect) + '</p>';
  if (w.gradual_lines.length){
    h += '<h3>Gradual — ' + esc(w.gradual_cite) + '</h3><p>' +
         esc(w.gradual_lines.join(' ')).replace(/&lt;\/?b&gt;/g, '') + '</p>';
  }
  if (w.next_sunday_readings){
    h += '<h3>Next Sunday’s Readings' + (w.next_sunday_label ? ' (' + esc(w.next_sunday_label) + ')' : '') + '</h3>';
    h += '<p>' + esc(w.next_sunday_readings) + '</p>';
  }
  return h + '</div>';
}

function overview(w){

    h += '<div class="card"><h2>How to Use This Week’s Devotions</h2>' +
      '<p>Gather once a day — at breakfast, supper, or bedtime, whenever your family is already together. ' +
      'Ten minutes is plenty. Here is the simple order:</p>' +
      '<ol class="order">' +
      '<li><strong>Begin with the Invocation.</strong> Speak together: <em>“In the name of the Father and of the ✠ Son and of the Holy Spirit. Amen.”</em> ' +
      'These are the same words spoken at your Baptism — you may make the sign of the cross as a reminder of it.</li>' +
      '<li><strong>Say the memory verse together</strong> (just below). By Saturday, even the littlest ones will know parts of it.</li>' +
      '<li><strong>Read today’s readings</strong> from the day’s tab above — or just one of them if time is short.</li>' +
      '<li><strong>Talk about it</strong> using the day’s questions for younger and older children.</li>' +
      '<li><strong>Sing the hymn stanza</strong> for the week (links to the tune are below).</li>' +
      '<li><strong>Pray.</strong> Pray for the day’s theme, add your family’s own petitions, and close with the Lord’s Prayer.</li>' +
      '<li><strong>End with the blessing:</strong> <em>“Let us bless the Lord. Thanks be to God.”</em></li>' +
      '</ol>' +
      '<p class="reassure">Missed a day? Just pick up where you are — the goal is God’s Word in your home, not a perfect record.</p>';
  } else {

  }
